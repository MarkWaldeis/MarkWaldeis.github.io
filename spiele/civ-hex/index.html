<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Civ7 Style — Orthographic Hex Map (Natural Terrain Only)</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06223f;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  /* tooltip - verbatim required */
  #tooltip{
    position:fixed;right:22px;bottom:196px;z-index:10;pointer-events:none;
    width:300px;background:linear-gradient(180deg,rgba(12,18,28,.88),rgba(12,18,28,.78));
    border:1px solid rgba(255,205,130,.35);border-radius:10px;
    box-shadow:0 8px 32px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    color:#f3ead6;backdrop-filter:blur(10px);overflow:hidden;
  }
  #tooltip .t-head{
    padding:10px 14px 8px 14px;border-bottom:1px solid rgba(255,205,130,.18);
    font-weight:800;font-size:15px;letter-spacing:1.5px;color:#ffe2a8;
  }
  #tooltip .t-row{padding:7px 14px;font-size:13.5px;line-height:1.35;}
  #tooltip .t-row.dim{color:#d6cdb8;opacity:.92;}
  #tooltip .t-row.gold{color:#ffcf7a;}
  #tooltip .t-prod{
    display:inline-flex;align-items:center;gap:6px;margin:6px 14px 12px 14px;
    background:rgba(255,200,110,.12);border:1px solid rgba(255,200,110,.28);
    border-radius:18px;padding:4px 10px;font-size:13px;color:#ffe1a0;
  }
  #tooltip .t-prod i{
    width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#fff2c8,#e8a83e 60%,#8a5a12);
    color:#3a2400;font-style:normal;font-weight:800;font-size:12px;
  }
  /* minimap + compass */
  #miniWrap{
    position:fixed;right:22px;bottom:18px;z-index:10;display:flex;align-items:flex-end;gap:12px;pointer-events:none;
  }
  #compass{
    width:84px;height:84px;border-radius:50%;position:relative;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #6b6f7a 0%, #2b2e36 18%, #14161c 55%, #0a0c10 100%);
    border:4px solid #c9a44a;
    box-shadow:0 0 0 2px #6b4d18, 0 0 0 4px #2a200e, 0 6px 24px rgba(0,0,0,.6), inset 0 2px 8px rgba(255,230,160,.35), inset 0 -4px 10px rgba(0,0,0,.7);
  }
  #compass:before{
    content:"";position:absolute;inset:6px;border-radius:50%;
    border:1px dashed rgba(255,220,150,.55);
  }
  #compass .needle{
    position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);
  }
  #compass .n-label{
    position:absolute;left:50%;top:3px;transform:translateX(-50%);
    color:#ffe6a8;font-weight:800;font-size:12px;text-shadow:0 1px 2px #000;
  }
  #minimapBox{
    width:228px;height:150px;border-radius:10px;overflow:hidden;position:relative;
    border:1px solid rgba(255,205,130,.55);
    box-shadow:0 8px 28px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.4);
    background:#07182e;opacity:.88;
  }
  #minimapBox canvas{width:100%;height:100%;display:block;image-rendering:auto;}
  #minimapBox:after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 24px rgba(0,0,0,.55);border-radius:10px;
  }
  #logo{
    position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:10;pointer-events:none;
    display:flex;align-items:center;gap:7px;color:rgba(232,238,244,.85);font-size:12.5px;letter-spacing:.2px;
    background:transparent;padding:4px 10px;border:none;
  }
  #logo .ico{
    width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:11px;
  }
  #loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    background:radial-gradient(ellipse at 50% 55%, #14365c 0%, #081a30 60%, #040c18 100%);
    color:#ffd9a0;z-index:20;transition:opacity .7s;font-size:13px;letter-spacing:2.5px;
  }
  #loader .bar{width:220px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
  #loader .bar i{display:block;height:100%;width:40%;background:#ffcf7a;border-radius:2px;animation:slide 1.1s infinite linear;}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(550%)}}
  #compass .tick{position:absolute;left:50%;top:50%;width:2px;height:7px;background:rgba(255,225,160,.75);transform-origin:50% 50%;}
  #compass .lbl{position:absolute;font-size:9px;font-weight:800;color:#ffe6a8;text-shadow:0 1px 2px #000;}
  #compass .lbl.e{right:6px;top:50%;transform:translateY(-50%);} #compass .lbl.w{left:6px;top:50%;transform:translateY(-50%);}
  #compass .lbl.s{left:50%;bottom:4px;transform:translateX(-50%);}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>

<div id="tooltip">
  <div class="t-head">FLAT PLAINS</div>
  <div class="t-row dim">Plains Floodplain</div>
  <div class="t-row gold">South America &bull; Ker&uuml;len River</div>
  <div class="t-prod"><i>1</i><span>1</span></div>
</div>

<div id="miniWrap">
  <div id="compass">
    <div class="n-label">N</div><div class="lbl e">E</div><div class="lbl w">W</div><div class="lbl s">S</div>
    <svg class="needle" viewBox="0 0 44 44">
      <polygon points="22,6 26,22 22,20 18,22" fill="#f2ede0" stroke="#111" stroke-width="0.7"/>
      <polygon points="22,38 26,22 22,24 18,22" fill="#b70000" stroke="#111" stroke-width="0.7"/>
      <circle cx="22" cy="22" r="3.4" fill="none" stroke="#c9a44a" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="3.2" fill="#c9a44a" stroke="#3a2a08" stroke-width="1"/>
      <circle cx="22" cy="22" r="1.2" fill="#1a1a1a"/>
    </svg>
  </div>
  <div id="minimapBox"><canvas id="minimap" width="456" height="300"></canvas></div>
</div>

<div id="logo"><span class="ico">◉</span> siliconera.com</div>
<div id="loader"><div>GENERATING CONTINENT…</div><div class="bar"><i></i></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ RENDERER / SCENE / ORTHO CAMERA ============ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06223f);
scene.fog = new THREE.Fog(0x0a2a4e, 90, 220);

let frustum = 34;
let aspect = window.innerWidth/window.innerHeight;
const camera = new THREE.OrthographicCamera(-frustum*aspect/2, frustum*aspect/2, frustum/2, -frustum/2, 0.1, 500);
// tilted top-down: high Y, moderate Z -> see elevation
camera.position.set(6, 46, 22);
camera.lookAt(0,0,2);
camera.zoom = 1.05;
camera.updateProjectionMatrix();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,0,2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minZoom = 0.55;
controls.maxZoom = 3.2;
controls.maxPolarAngle = Math.PI*0.32;
controls.minPolarAngle = Math.PI*0.08;
controls.update();

/* ============ LIGHTS ============ */
const sunDir = new THREE.Vector3(0.55, 0.75, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xfff2d8, 2.05);
sun.position.copy(sunDir).multiplyScalar(80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-32; sun.shadow.camera.right=32;
sun.shadow.camera.top=32; sun.shadow.camera.bottom=-32;
sun.shadow.camera.near=20; sun.shadow.camera.far=160;
sun.shadow.bias=-0.0008;
sun.shadow.normalBias=0.02;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd7ff, 0x8a6f4a, 0.7));
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-40,25,-30);
scene.add(fill);

/* ============ PROCEDURAL TEXTURES ============ */
function canvasTex(size, draw){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}
function grain(g,s,base,amp,n=2600){
  g.fillStyle=base; g.fillRect(0,0,s,s);
  for(let i=0;i<n;i++){
    const v=(Math.random()-0.5)*amp;
    const a=Math.random()*0.09;
    g.fillStyle = v>0?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;
    const sz=1+Math.random()*2.2;
    g.fillRect(Math.random()*s, Math.random()*s, sz, sz);
  }
}
const sandTex = canvasTex(256,(g,s)=>{ grain(g,s,'#d9b06a',40); 
  g.strokeStyle='rgba(120,80,30,0.18)';
  for(let i=0;i<40;i++){ g.beginPath(); const y=Math.random()*s; g.moveTo(0,y); g.bezierCurveTo(s*0.3,y+6,s*0.6,y-6,s,y); g.stroke(); }
});
const grassTex = canvasTex(256,(g,s)=>{ grain(g,s,'#6daa3c',46);
  g.strokeStyle='rgba(30,80,20,0.22)';
  for(let i=0;i<180;i++){ const x=Math.random()*s,y=Math.random()*s; g.beginPath(); g.moveTo(x,y); g.lineTo(x+2,y-5-Math.random()*4); g.stroke(); }
});
const snowTex = canvasTex(256,(g,s)=>{ grain(g,s,'#eef4fb',18,1400); });
const rockTex = canvasTex(256,(g,s)=>{ grain(g,s,'#7a6a58',60,3200); });
const waterBump = canvasTex(256,(g,s)=>{
  g.fillStyle='#808080'; g.fillRect(0,0,s,s);
  for(let i=0;i<900;i++){ const x=Math.random()*s,y=Math.random()*s,r=2+Math.random()*7;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,0.18)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
});
waterBump.colorSpace = THREE.NoColorSpace;

/* ============ NOISE / MAP GEN ============ */
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function smooth(t){ return t*t*(3-2*t); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  const u=smooth(xf), v=smooth(yf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,oct=4){
  let v=0, amp=0.5, f=1;
  for(let i=0;i<oct;i++){ v+=amp*vnoise(x*f,y*f); amp*=0.5; f*=2.03; }
  return v;
}

const HEX_R = 1.0;
const COLS = 30, ROWS = 21;
const SQ3 = Math.sqrt(3);
function axialToWorld(q,r){ // pointy-top
  return { x: HEX_R*SQ3*(q + r/2), z: HEX_R*1.5*r };
}
const SEA = 0.42;
function heightAt(q,r){
  const cx = q - COLS/2 + 0.5;
  const cz = r - ROWS/2;
  const nx = cx/(COLS/2); // -1..1
  const nz = cz/(ROWS/2);
  const n1 = fbm(q*0.16+7.3, r*0.16+3.1, 4);      // coast detail
  const n2 = fbm(q*0.45+1.7, r*0.45+9.2, 3);      // micro
  // main continent ellipse (center-south) + western bulge
  const dMain = (nx*1.05)*(nx*1.05) + ((nz+0.22)*1.05)*((nz+0.22)*1.05);
  let h = 0.78 - dMain*0.85;
  // northern land bridge (snow) force up
  const northBoost = THREE.MathUtils.smoothstep(-nz, 0.45, 0.95)*0.45;
  h += northBoost;
  // eastern archipelago chain
  const arch = Math.exp(-Math.pow((nx-0.72)*3.2,2) - Math.pow((nz-0.05)*2.0,2))*0.42
             + Math.exp(-Math.pow((nx-0.95)*4.0,2) - Math.pow((nz+0.45)*3.0,2))*0.38
             + Math.exp(-Math.pow((nx-0.55)*4.5,2) - Math.pow((nz+0.62)*3.5,2))*0.34;
  h += arch;
  // southwestern islands
  h += Math.exp(-Math.pow((nx+0.85)*3.5,2)-Math.pow((nz-0.55)*3.0,2))*0.32;
  h += (n1-0.5)*0.55 + (n2-0.5)*0.18;
  // mountain spine (diagonal ridge central-north)
  const ridge = Math.exp(-Math.pow((nx*0.8+nz*0.6+0.28)*3.0,2))*0.22*(0.5+n1);
  h += ridge;
  return h;
}
function moistureAt(q,r){ return fbm(q*0.22+31.7, r*0.22+17.3, 4); }

// Build height grid first
const grid=[]; // {q,r,h,m,x,z}
for(let r=0;r<ROWS;r++) for(let q=0;q<COLS;q++){
  const {x,z}=axialToWorld(q,r);
  grid.push({q,r,h:heightAt(q,r), m:moistureAt(q,r), x, z:z});
}
function neighbors(q,r){
  const dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  return dirs.map(([dq,dr])=>[q+dq,r+dr]).filter(([qq,rr])=>qq>=0&&qq<COLS&&rr>=0&&rr<ROWS);
}
const hMap=new Map(grid.map(c=>[c.q+','+c.r,c]));

/* ============ BIOME CLASSIFICATION ============ */
function classify(c){
  const e = c.h - SEA;
  const nz = (c.r - ROWS/2)/(ROWS/2); // -1 north .. 1 south
  const depth = SEA - c.h;
  if(e < 0){
    if(depth < 0.16) return 'shallow';
    return 'deep';
  }
  // land — thicker northern snow/tundra boundary (4-6 rows)
  if(nz < -0.52) return (e>0.24?'snowMountain':'snow');
  if(e > 0.34) return (nz<-0.22?'snowMountain':'mountain');
  if(e > 0.20) return 'hills';
  // lowland
  const desertZone = (nz>-0.35 && nz<0.45 && c.q>COLS*0.28 && c.q<COLS*0.72 && c.m<0.58);
  if(desertZone){
    if(c.m>0.48 && hash2(c.q*3.1,c.r*2.7)<0.28) return 'forestDry';
    return (hash2(c.q*1.3,c.r*1.7)<0.32?'desertHills':'desert');
  }
  if(c.m>0.54 && nz>-0.5){
    if(nz<-0.12 && hash2(c.q,c.r)<0.7) return 'forestConifer';
    return 'forest';
  }
  if(nz<-0.32) return (c.m>0.45?'forestConifer':'tundra');
  if(hash2(c.q*2.2,c.r*3.3)<0.18) return 'hills';
  return 'grass';
}

const BIOME_COLORS = {
  desert:    [0xd9b06a, 0xcfa052, 0xe2bd7a, 0xc49a52],
  desertHills:[0xb98d4e,0xa87c3f,0xc49a58],
  grass:     [0x6fae3e, 0x7cbb45, 0x64a137, 0x8ab84a, 0xa8b84a],
  hills:     [0x8aa04a, 0x9aa84e, 0x7a9440],
  forest:    [0x4d8f2e, 0x5da133, 0x468228],
  forestConifer:[0x2f7a2e,0x3a8a34,0x2a6e2a],
  forestDry: [0x7a9a3a,0x8aa84a],
  mountain:  [0x7a624e,0x6b5544,0x8a725c],
  snowMountain:[0x8a8a95,0x7a7a88],
  snow:      [0xe8eef6,0xdde6f2,0xf2f6fc],
  tundra:    [0xb8c4b0,0xc4ccb8,0xa8b8a8],
  shallow:   [0x2ec4c0,0x35d0c8],
  deep:      [0x0a3a6e,0x0c4480,0x083060],
};

for(const c of grid) c.biome = classify(c);
// Force a clear floodplain Flat Plains near center for selection + river adjacency
let selCell = hMap.get('14,12') || grid[Math.floor(grid.length/2)];
selCell.biome='grass'; selCell.h = SEA+0.09;
const selNeighbors = neighbors(selCell.q, selCell.r);
for(const [qq,rr] of selNeighbors.slice(0,3)){
  const nc=hMap.get(qq+','+rr); if(nc && nc.biome==='deep'){ nc.biome='shallow'; nc.h=SEA-0.05; }
}
// River carve BEFORE hex/detail gen so no floating peaks/trees (fixes F1)
const riverCellSet = new Set(['13,4','13,5','14,6','13,7','14,8','14,9','13,10','14,11','14,12','13,13','14,14','13,15','14,16','15,8','16,9','17,9','18,10','15,12','16,12','17,13','18,13','19,14']);
for(const key of riverCellSet){
  const c=hMap.get(key);
  if(c && c!==selCell && c.biome!=='deep' && c.biome!=='shallow'){
    c.biome='grass';
    c.h = SEA+0.09;
    c.isRiverBank=true;
  }
}

/* ============ MATERIALS ============ */
const matCache={};
function biomeMaterial(biome){
  if(matCache[biome]) return matCache[biome];
  let m;
  if(biome==='deep') m=new THREE.MeshStandardMaterial({color:0x0d3f7a, roughness:0.32, metalness:0.12, transparent:true, opacity:0.94, bumpMap:waterBump, bumpScale:0.6});
  else if(biome==='shallow') m=new THREE.MeshStandardMaterial({color:0x2ee6cf, roughness:0.24, metalness:0.05, transparent:true, opacity:0.78, emissive:0x0e7a72, emissiveIntensity:0.32, bumpMap:waterBump, bumpScale:0.35});
  else if(biome==='desert') m=new THREE.MeshStandardMaterial({map:sandTex, roughness:0.93, bumpMap:waterBump, bumpScale:0.25});
  else if(biome==='desertHills') m=new THREE.MeshStandardMaterial({map:sandTex, roughness:0.95, color:0xc8a878, bumpMap:waterBump, bumpScale:0.4});
  else if(biome==='grass') m=new THREE.MeshStandardMaterial({map:grassTex, roughness:0.88, bumpMap:waterBump, bumpScale:0.22});
  else if(biome==='hills') m=new THREE.MeshStandardMaterial({map:grassTex, roughness:0.9, color:0xd8d0a0, bumpMap:waterBump, bumpScale:0.35});
  else if(biome==='forest'||biome==='forestDry') m=new THREE.MeshStandardMaterial({map:grassTex, roughness:0.9, color:0x9fbf7a, bumpMap:waterBump, bumpScale:0.25});
  else if(biome==='forestConifer') m=new THREE.MeshStandardMaterial({color:0x4a7a3a, map:grassTex, roughness:0.9, bumpMap:waterBump, bumpScale:0.25});
  else if(biome==='mountain') m=new THREE.MeshStandardMaterial({map:rockTex, roughness:0.96, flatShading:true, bumpMap:waterBump, bumpScale:0.5});
  else if(biome==='snowMountain') m=new THREE.MeshStandardMaterial({map:rockTex, roughness:0.88, flatShading:true, color:0xcfd4de, bumpMap:waterBump, bumpScale:0.4});
  else if(biome==='snow') m=new THREE.MeshStandardMaterial({map:snowTex, roughness:0.68, bumpMap:waterBump, bumpScale:0.18});
  else m=new THREE.MeshStandardMaterial({map:grassTex, roughness:0.88, color:0xb8c4a0, bumpMap:waterBump, bumpScale:0.25});
  // PBR: repeat detail so 256px grain doesn't stretch
  if(m.map){ m.map.repeat.set(1,1); }
  matCache[biome]=m;
  return m;
}
function jitterColor(hex, amt=0.06){
  const c=new THREE.Color(hex);
  const hsl={}; c.getHSL(hsl);
  c.setHSL(hsl.h+(Math.random()-0.5)*0.02, THREE.MathUtils.clamp(hsl.s*(1+(Math.random()-0.5)*0.3),0,1), THREE.MathUtils.clamp(hsl.l+(Math.random()-0.5)*amt,0,1));
  return c;
}

/* ============ HEX MESHES ============ */
const mapGroup=new THREE.Group();
scene.add(mapGroup);
const hexGeoLand = new THREE.CylinderGeometry(HEX_R*0.98, HEX_R*0.92, 1, 6, 1);
hexGeoLand.rotateY(Math.PI/6);
const edgeGeo = new THREE.EdgesGeometry(hexGeoLand);
const edgeMat = new THREE.LineBasicMaterial({color:0x1a2a1a, transparent:true, opacity:0.10});

function landHeight(biome,e){
  if(biome==='mountain'||biome==='snowMountain') return 2.6+e*4.0;
  if(biome==='hills'||biome==='desertHills') return 1.15+e*2.0;
  if(biome==='snow') return 0.85;
  if(biome==='tundra') return 0.7;
  return 0.62+e*1.6;
}

const treePositionsConifer=[], treePositionsLeaf=[];
const mountainCells=[], hillCells=[];

for(const c of grid){
  const e=Math.max(0,c.h-SEA);
  const isWater=(c.biome==='deep'||c.biome==='shallow');
  let hgt = isWater ? (c.biome==='shallow'?0.55:0.30) : landHeight(c.biome,e);
  if(c===selCell) hgt=0.62;
  const geo = hexGeoLand;
  const baseMat = biomeMaterial(c.biome);
  const mat = baseMat.clone();
  const palette = BIOME_COLORS[c.biome]||[0xffffff];
  const pick = palette[Math.floor(Math.random()*palette.length)];
  const jc = jitterColor(pick, 0.06);
  mat.color.copy(jc);
  mat.color.offsetHSL(0, 0.03, 0.005);

  const mesh=new THREE.Mesh(geo, mat);
  mesh.scale.set(1,hgt,1);
  if(c.biome==='shallow') mesh.position.set(c.x, -1.02+hgt/2, c.z); // top ~ -0.745+? tuned to sit above ocean trough
  else if(c.biome==='deep') mesh.position.set(c.x, -1.25+hgt/2, c.z); // top ~ -1.10, below ocean plane
  else mesh.position.set(c.x, -0.55+hgt/2, c.z);
  mesh.receiveShadow=true; mesh.castShadow=!isWater;
  mesh.userData.cell=c;
  c.topY = mesh.position.y + hgt/2;
  c.mesh=mesh;
  mapGroup.add(mesh);
  if(!isWater){
    const edge=new THREE.LineSegments(edgeGeo, edgeMat);
    edge.position.copy(mesh.position); edge.scale.copy(mesh.scale);
    mapGroup.add(edge);
  }

  if(c.biome==='mountain'||c.biome==='snowMountain') mountainCells.push(c);
  else if(c.biome==='hills'||c.biome==='desertHills') hillCells.push(c);
  if((c.biome==='forest'||c.biome==='forestConifer'||c.biome==='forestDry') && c!==selCell){
    // denser Civ7 clusters: 9-12 trees with clumping
    const density = c.biome==='forestConifer'? 11 : 9;
    const clX=(Math.random()-0.5)*0.5, clZ=(Math.random()-0.5)*0.5;
    for(let i=0;i<density;i++){
      if(Math.random()<0.08) continue;
      const a=Math.random()*Math.PI*2, rr=Math.pow(Math.random(),0.6)*0.68;
      const px=c.x+clX*0.5+Math.cos(a)*rr, pz=c.z+clZ*0.5+Math.sin(a)*rr*0.9;
      const isCon = c.biome==='forestConifer' ? (Math.random()<0.85) : Math.random()<0.45;
      const tier = Math.random()<0.25?0.55+Math.random()*0.25 : 0.75+Math.random()*0.65;
      (isCon?treePositionsConifer:treePositionsLeaf).push({x:px,y:c.topY,z:pz,s:tier});
    }
    // underbrush
    if(Math.random()<0.7){
      const bx=c.x+(Math.random()-0.5)*0.9, bz=c.z+(Math.random()-0.5)*0.9;
      (Math.random()<0.5?treePositionsConifer:treePositionsLeaf).push({x:bx,y:c.topY,z:bz,s:0.38+Math.random()*0.2});
    }
  }
}

function makeTrees(list, conifer){
  if(!list.length) return;
  const trunkGeo=new THREE.CylinderGeometry(0.05,0.08,0.35,6);
  const trunkMat=new THREE.MeshStandardMaterial({color:0x5a3d24, roughness:0.9});
  const trunk=new THREE.InstancedMesh(trunkGeo, trunkMat, list.length);
  let folGeo, folMat;
  if(conifer){
    folGeo=new THREE.ConeGeometry(0.32,0.95,7);
    folMat=new THREE.MeshStandardMaterial({color:0x2e7a2e, roughness:0.85, flatShading:true});
  } else {
    folGeo=new THREE.IcosahedronGeometry(0.34,0);
    folMat=new THREE.MeshStandardMaterial({color:0x4da02e, roughness:0.85, flatShading:true});
  }
  const fol=new THREE.InstancedMesh(folGeo, folMat, list.length);
  const fol2 = conifer? null : new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.24,0), new THREE.MeshStandardMaterial({color:0x6fbf3a, roughness:0.85, flatShading:true}), list.length);
  const d=new THREE.Object3D();
  const col=new THREE.Color();
  list.forEach((t,i)=>{
    d.position.set(t.x, t.y+0.17*t.s, t.z); d.scale.setScalar(t.s); d.rotation.y=Math.random()*6.28; d.updateMatrix();
    trunk.setMatrixAt(i,d.matrix);
    const fy = conifer? t.y+(0.35+0.45)*t.s : t.y+(0.35+0.28)*t.s;
    d.position.set(t.x, fy, t.z); d.updateMatrix();
    fol.setMatrixAt(i,d.matrix);
    if(conifer){
      col.setHSL(0.32+Math.random()*0.04, 0.55+Math.random()*0.2, 0.28+Math.random()*0.1);
      fol.setColorAt(i,col);
    } else {
      col.setHSL(0.24+Math.random()*0.08, 0.6+Math.random()*0.2, 0.32+Math.random()*0.12);
      fol.setColorAt(i,col);
      d.position.y+=0.22*t.s; d.scale.multiplyScalar(0.85); d.updateMatrix();
      fol2.setMatrixAt(i,d.matrix);
      fol2.setColorAt(i, col.clone().offsetHSL(0.02,0.05,0.06));
    }
  });
  trunk.castShadow=fol.castShadow=true; trunk.receiveShadow=fol.receiveShadow=true;
  mapGroup.add(trunk,fol); if(fol2){ fol2.castShadow=true; mapGroup.add(fol2); }
}

const oceanGeo=new THREE.PlaneGeometry(140,90,90,60);

const oceanMat=new THREE.ShaderMaterial({
  transparent:true,
  fog:true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uTime:{value:0},
    uDeep:{value:new THREE.Color(0x072a5e)},
    uMid:{value:new THREE.Color(0x0e5a9a)},
    uShallow:{value:new THREE.Color(0x2ee6cf)},
    uSand:{value:new THREE.Color(0xe6c98a)},
    uSun:{value:sunDir.clone()},
  }]),
  vertexShader:`
    #include <fog_pars_vertex>
    uniform float uTime;
    varying vec3 vWorld; varying float vWave; varying vec3 vNorm;
    void main(){
      vec3 p=position;
      vec4 w=modelMatrix*vec4(p,1.0);
      float w1=sin(w.x*0.55+uTime*1.1)*0.08;
      float w2=sin(w.z*0.7-uTime*0.9)*0.06;
      float w3=sin((w.x+w.z)*0.35+uTime*1.6)*0.04;
      w.y+=w1+w2+w3;
      w.y += -0.74;
      vWave=w1+w2+w3;
      vWorld=w.xyz;
      vNorm=normalize(vec3(-0.12*cos(w.x*0.55+uTime*1.1),1.0,-0.12*cos(w.z*0.7-uTime*0.9)));
      vec4 mvPosition = viewMatrix*vec4(w,1.0);
      gl_Position=projectionMatrix*mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`
    #include <fog_pars_fragment>
    uniform float uTime; uniform vec3 uDeep,uMid,uShallow,uSand,uSun;
    varying vec3 vWorld; varying float vWave; varying vec3 vNorm;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
    void main(){
      float n=noise(vWorld.xz*0.35+uTime*0.05);
      float n2=noise(vWorld.xz*1.15-uTime*0.08);
      float n3=noise(vWorld.xz*0.12+3.7);
      vec3 V=normalize(cameraPosition-vWorld);
      vec3 N=normalize(vNorm+vec3((n-0.5)*0.28,0.0,(n2-0.5)*0.28));
      float fres=pow(1.0-max(dot(N,V),0.0),3.0);
      // deep base with variation
      vec3 col=mix(uDeep,uMid, clamp(vWave*2.2+0.5+n*0.28,0.0,1.0)*0.65);
      // shallow turquoise + sand subsurface scattering in noisy shallows band
      float shallowMask = smoothstep(0.55,0.78,n3+n*0.22);
      vec3 shallowCol = mix(uSand*0.9, uShallow, 0.55+0.35*n2);
      // subsurface scattering: sun through water
      float sss = pow(max(dot(V,normalize(uSun+vec3(0.0,0.35,0.0))),0.0),3.0);
      shallowCol += uShallow*sss*0.45;
      col = mix(col, shallowCol, shallowMask*0.75);
      // sparkle sun glitter
      vec3 R=reflect(-V,N);
      float spec=pow(max(dot(R,normalize(uSun)),0.0),140.0);
      col+=vec3(1.0,0.85,0.6)*spec*1.4*(0.6+0.4*n2);
      col+=vec3(1.0,0.9,0.7)*pow(max(dot(R,normalize(uSun)),0.0),18.0)*0.20;
      float foam=smoothstep(0.14,0.24,vWave+(n2-0.5)*0.14)*0.20;
      foam += smoothstep(0.72,0.82,n3)*smoothstep(0.1,0.2,vWave+0.15)*0.35;
      col=mix(col,vec3(0.88,0.96,0.99),clamp(foam,0.0,0.65));
      col=mix(col, vec3(0.55,0.75,0.85), fres*0.30);
      float alpha = mix(0.92, 0.72, shallowMask*0.8);
      gl_FragColor=vec4(col,alpha);
      #include <fog_fragment>
    }`
});

/* ============ RIVERS (branching, shallow 3D, carved pre-gen) ============ */
function cellWorld(q,r, lateral=0){ const c=hMap.get(q+','+r); if(!c) return null;
  // meander: lateral offset perpendicular to flow + slight downstream taper handled in ribbon
  return new THREE.Vector3(c.x+lateral, c.topY+0.07, c.z+(hash2(q*1.7,r*2.3)-0.5)*0.22);
}
const riverMainQs = [[13,4],[13,5],[14,6],[13,7],[14,8],[14,9],[13,10],[14,11],[14,12],[13,13],[14,14],[13,15],[14,16]];
const riverBranchQs = [[14,8],[15,8],[16,9],[17,9],[18,10]];
const riverBranch2Qs = [[14,11],[15,12],[16,12],[17,13],[18,13],[19,14]];
function pathFromQs(list){
  const pts=[];
  list.forEach(([q,r],i)=>{ const lat=(i%2?0.14:-0.14)*(0.5+hash2(q,r)*0.8); const v=cellWorld(q,r,lat); if(v) pts.push(v); });
  return new THREE.CatmullRomCurve3(pts);
}
const riverMat=new THREE.MeshStandardMaterial({color:0x3ec6e8, roughness:0.15, metalness:0.1, transparent:true, opacity:0.92, emissive:0x0a6a8a, emissiveIntensity:0.35});
const riverBankMat=new THREE.MeshStandardMaterial({color:0xe2c88a, roughness:1});
function buildRiver(curve, width=0.32){
  const pts=curve.getPoints(80);
  // ribbon
  const verts=[], uvs=[], idx=[];
  const up=new THREE.Vector3(0,1,0);
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    const tangent=curve.getTangent(i/(pts.length-1));
    const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize().multiplyScalar(width/2);
    verts.push(p.x-side.x, p.y+0.02, p.z-side.z, p.x+side.x, p.y+0.02, p.z+side.z);
    uvs.push(i/pts.length*8,0, i/pts.length*8,1);
    if(i<pts.length-1){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g, riverMat);
  m.receiveShadow=true;
  mapGroup.add(m);
  // banks (two thin strips)
  for(const s of [-1,1]){
    const bVerts=[], bIdx=[];
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      const tangent=curve.getTangent(i/(pts.length-1));
      const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();
      const inner=width/2, outer=width/2+0.18;
      bVerts.push(p.x+side.x*s*inner, p.y+0.005, p.z+side.z*s*inner,
                  p.x+side.x*s*outer, p.y-0.02, p.z+side.z*s*outer);
      if(i<pts.length-1){ const a=i*2; bIdx.push(a,a+2,a+1, a+1,a+2,a+3); }
    }
    const bg=new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(bVerts,3));
    bg.setIndex(bIdx); bg.computeVertexNormals();
    mapGroup.add(new THREE.Mesh(bg, riverBankMat));
  }
}
buildRiver(pathFromQs(riverMainQs),0.38);
buildRiver(pathFromQs(riverBranchQs),0.26);

    const rip=new THREE.Mesh(new THREE.RingGeometry(0.32,0.38,20), new THREE.MeshBasicMaterial({color:0x9ae8ff, transparent:true, opacity:0.6, side:THREE.DoubleSide}));
    rip.rotation.x=-Math.PI/2; rip.position.y=-0.35; grp.add(rip);
    grp.userData.ripple=rip;
  } else if(type==='crabs'){
    const cm=new THREE.MeshStandardMaterial({color:0xe84a3a, roughness:0.6});
    const body=new THREE.Mesh(new THREE.SphereGeometry(0.16,10,8), cm);
    body.scale.set(1.2,0.6,1); body.position.y=0.24; body.castShadow=true; grp.add(body);
    for(const s of [-1,1]){
      const claw=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6), cm);
      claw.position.set(s*0.22,0.28,0.10); grp.add(claw);
    }
    const sp=textSprite('🦀',0.66); sp.position.y=0.70; grp.add(sp);
  } else if(type==='gold'){
    const gm=new THREE.Mesh(new THREE.DodecahedronGeometry(0.18,0), new THREE.MeshStandardMaterial({color:0xffd34a, roughness:0.25, metalness:0.9, emissive:0x6a4a00, emissiveIntensity:0.3}));
    gm.position.y=0.28; gm.castShadow=true; grp.add(gm);
    const sp=textSprite('🪙',0.6); sp.position.y=0.70; grp.add(sp);
  } else if(type==='stone'){
    const sm=new THREE.Mesh(new THREE.DodecahedronGeometry(0.22,0), new THREE.MeshStandardMaterial({color:0x9a9aa2, roughness:0.9, flatShading:true}));
    sm.position.y=0.24; sm.castShadow=true; grp.add(sm);
    const sp=textSprite('🪨',0.6); sp.position.y=0.70; grp.add(sp);
  }
  grp.userData.baseY=grp.position.y;
  grp.userData.phase=Math.random()*6.28;
  mapGroup.add(grp);
  floaters.push(grp);
  return grp;
}
// Dense distribution: pick cells by biome (exclude riverbanks so icons don't intersect ribbon)
function pickCells(biomeList, count, excludeSel=true){
  const pool=grid.filter(c=>biomeList.includes(c.biome) && (!excludeSel||c!==selCell) && !c.isRiverBank);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,count);
}
{
  pickCells(['grass'],10).forEach(c=>addResource(c,'wheat'));
  pickCells(['grass','desert'],5).forEach(c=>addResource(c,'corn'));
  const adjCands=[[selCell.q-1,selCell.r],[selCell.q,selCell.r+1],[selCell.q,selCell.r-1]].map(([q,r])=>hMap.get(q+','+r)).filter(c=>c&&c!==selCell&&!c.isRiverBank&&c.biome!=='deep'&&c.biome!=='shallow');
  if(adjCands[0]) addResource(adjCands[0],'wheat');

  pickCells(['hills','mountain','desertHills'],8).forEach(c=>addResource(c,'iron'));
  pickCells(['hills','mountain','snowMountain'],7).forEach(c=>addResource(c,'coal'));
  pickCells(['grass','desert'],8).forEach(c=>addResource(c,'horses'));
  pickCells(['shallow'],8).forEach(c=>addResource(c,'fish'));
  pickCells(['shallow'],5).forEach(c=>addResource(c,'crabs'));
  pickCells(['desert','desertHills'],4).forEach(c=>addResource(c,'gold'));
  pickCells(['tundra','hills'],3).forEach(c=>addResource(c,'stone'));
}

/* ============ MAP MARKERS (red + blue, no units) ============ */
function addPin(cell, colorHex, h=1.6){
  const g=new THREE.Group();
  g.position.set(cell.x, cell.topY, cell.z);
  const mat=new THREE.MeshStandardMaterial({color:colorHex, roughness:0.32, emissive:colorHex, emissiveIntensity:0.35});
  const pin=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.7,12), mat);
  pin.rotation.x=Math.PI; pin.position.y=h; pin.castShadow=true; g.add(pin);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.26,14,12), mat);
  head.position.y=h+0.42; head.castShadow=true; g.add(head);
  const inner=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4}));
  inner.position.set(0,h+0.48,0.16); g.add(inner);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,h,6), new THREE.MeshStandardMaterial({color:0x222222}));
  stem.position.y=h/2; g.add(stem);
  const halo=new THREE.Mesh(new THREE.RingGeometry(0.34,0.44,24), new THREE.MeshBasicMaterial({color:colorHex, transparent:true, opacity:0.55, side:THREE.DoubleSide}));
  halo.rotation.x=-Math.PI/2; halo.position.y=0.07; g.add(halo);
  g.userData.baseY=cell.topY; g.userData.halo=halo; g.userData.phase=Math.random()*6;
  mapGroup.add(g); floaters.push(g);
  return g;
}
function safeCell(q,r,fallbacks){
  const c=hMap.get(q+','+r);
  if(c && c.biome!=='deep' && c.biome!=='shallow') return c;
  return pickCells(fallbacks,1)[0];
}
{
  const redCell = safeCell(18,8,['grass','desert']);
  const blueCell = safeCell(10,14,['grass']);
  if(redCell) addPin(redCell, 0xe82a2a, 1.7);
  if(blueCell) addPin(blueCell, 0x2a7ae8, 1.6);
}

/* ============ SELECTION HIGHLIGHT (glowing hex) ============ */
let selHalo, selFill;
{
  const r=HEX_R*0.98;
  const pts=[];
  for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; pts.push(new THREE.Vector3(Math.sin(a)*r,0,Math.cos(a)*r)); }
  const loopGeo=new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat=new THREE.LineBasicMaterial({color:0xfff6b0, transparent:true, opacity:0.98, blending:THREE.AdditiveBlending, depthWrite:false});
  selHalo=new THREE.LineLoop(loopGeo, lineMat);
  selHalo.position.set(selCell.x, selCell.topY+0.14, selCell.z);
  // align rotation with hex tiles (pointy-top): LineLoop pts use angle PI/6 offset, matching hexGeo rotateY(PI/6)
  selHalo.rotation.y=0;
  mapGroup.add(selHalo);
  const fillGeo=new THREE.CylinderGeometry(r*0.92,r*0.92,0.04,6,1);
  fillGeo.rotateY(Math.PI/6);
  selFill=new THREE.Mesh(fillGeo, new THREE.MeshBasicMaterial({color:0xffe88a, transparent:true, opacity:0.26, depthWrite:false, blending:THREE.AdditiveBlending}));
  selFill.position.set(selCell.x, selCell.topY+0.10, selCell.z);
  mapGroup.add(selFill);
  const outerGeo=new THREE.CylinderGeometry(r*1.22,r*1.22,0.03,6,1,true);
  outerGeo.rotateY(Math.PI/6);
  const outer=new THREE.Mesh(outerGeo, new THREE.MeshBasicMaterial({color:0xffee88, transparent:true, opacity:0.45, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending}));
  outer.position.set(selCell.x, selCell.topY+0.08, selCell.z);
  outer.userData.isOuter=true;
  mapGroup.add(outer);
  selHalo.userData.outer=outer;
}

/* ============ MINIMAP ============ */
function drawMinimap(){
  const cv=document.getElementById('minimap');
  const g=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  g.fillStyle='#07182e'; g.fillRect(0,0,W,H);
  // bounds
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const c of grid){ minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minZ=Math.min(minZ,c.z); maxZ=Math.max(maxZ,c.z); }
  function px(x){ return (x-minX)/(maxX-minX)*(W-16)+8; }
  function pz(z){ return (z-minZ)/(maxZ-minZ)*(H-16)+8; }
  const colorFor=(b)=>{
    if(b==='deep') return '#0a2f66';
    if(b==='shallow') return '#2ecfc2';
    if(b==='desert'||b==='desertHills') return '#d9b06a';
    if(b==='grass') return '#6fae3e';
    if(b==='hills') return '#8aa04a';
    if(b.startsWith('forest')) return '#2f7a2e';
    if(b==='mountain') return '#7a624e';
    if(b==='snowMountain'||b==='snow') return '#eef4fb';
    if(b==='tundra') return '#b8c4b0';
    return '#888';
  };
  for(const c of grid){
    g.fillStyle=colorFor(c.biome);
    const X=px(c.x), Z=pz(c.z);
    const s=Math.max(5,(W/(COLS))*0.92);
    g.beginPath();
    for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; const vx=X+Math.cos(a)*s*0.62, vz=Z+Math.sin(a)*s*0.62; i?g.lineTo(vx,vz):g.moveTo(vx,vz); }
    g.closePath(); g.fill();
  }
  // rivers (all 3 branches)
  g.strokeStyle='#5ad6ff'; g.lineWidth=1.6;
  for(const path of [riverMainQs, riverBranchQs, riverBranch2Qs]){
    g.beginPath();
    path.forEach(([q,r],i)=>{ const c=hMap.get(q+','+r); if(!c) return; const X=px(c.x),Z=pz(c.z); i?g.lineTo(X,Z):g.moveTo(X,Z); });
    g.stroke();
  }
  // selection (hex outline)
  g.strokeStyle='#ffe88a'; g.lineWidth=2.2;
  g.beginPath();
  for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; const vx=px(selCell.x)+Math.cos(a)*8, vz=pz(selCell.z)+Math.sin(a)*8; i?g.lineTo(vx,vz):g.moveTo(vx,vz); }
  g.closePath(); g.stroke();
  // vignette gold
  g.strokeStyle='rgba(201,164,74,0.9)'; g.lineWidth=4; g.strokeRect(0,0,W,H);
}
drawMinimap();
// compass ticks (gold-engraved bezel detail)
{
  const comp=document.getElementById('compass');
  for(let i=0;i<24;i++){
    if(i%6===0) continue; // cardinal handled by N/E/S/W
    const tk=document.createElement('div');
    tk.className='tick';
    const ang=i*15;
    tk.style.transform=`translate(-50%,-50%) rotate(${ang}deg) translateY(-34px)`;
    tk.style.left='50%'; tk.style.top='50%';
    tk.style.height=(i%2?5:7)+'px';
    tk.style.opacity=(i%2?0.5:0.8);
    comp.appendChild(tk);
  }
}

/* ============ ANIMATE ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  oceanMat.uniforms.uTime.value=t;
  // float resources + pins bob (pins keep world Y via baseY)
  for(const f of floaters){
    if(f.userData.halo){
      f.userData.halo.material.opacity=0.42+Math.sin(t*2.2+f.userData.phase)*0.18;
      const by = (f.userData.baseY!==undefined)? f.userData.baseY : f.position.y;
      f.position.y=by+Math.sin(t*1.6+f.userData.phase)*0.07;
    } else if(f.userData.baseY!==undefined){
      f.position.y=f.userData.baseY+Math.sin(t*1.8+f.userData.phase)*0.10;
      f.rotation.y=Math.sin(t*0.6+f.userData.phase)*0.18;
      if(f.userData.ripple){
        const s=1+Math.sin(t*2.5)*0.12;
        f.userData.ripple.scale.set(s,s,1);
        f.userData.ripple.material.opacity=0.45+Math.sin(t*2.5)*0.15;
      }
    }
  }
  // selection pulse (XZ only, keep Y)
  const pulse=0.5+Math.sin(t*3.0)*0.5;
  selHalo.material.opacity=0.75+pulse*0.25;
  selHalo.scale.set(1+pulse*0.035,1,1+pulse*0.035);
  selFill.material.opacity=0.20+pulse*0.16;
  if(selHalo.userData.outer) selHalo.userData.outer.material.opacity=0.30+pulse*0.25;
  // river shimmer
  riverMat.emissiveIntensity=0.30+Math.sin(t*2.0)*0.12;
  const needle=document.querySelector('#compass .needle');
  if(needle) needle.style.transform=`translate(-50%,-50%) rotate(${-controls.getAzimuthalAngle()}rad)`;
  controls.update();
  renderer.render(scene,camera);
}
// hover highlight (raycast, keeps designated FLAT PLAINS selection intact)
{
  const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2();
  const hovGeo=new THREE.CylinderGeometry(HEX_R*0.99,HEX_R*0.99,0.05,6,1); hovGeo.rotateY(Math.PI/6);
  const hov=new THREE.Mesh(hovGeo, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.14, depthWrite:false, blending:THREE.AdditiveBlending}));
  hov.visible=false; mapGroup.add(hov);
  const landMeshes=grid.filter(c=>c.mesh && c.biome!=='deep' && c.biome!=='shallow').map(c=>c.mesh);
  renderer.domElement.addEventListener('pointermove', (ev)=>{
    ptr.x=(ev.clientX/window.innerWidth)*2-1; ptr.y=-(ev.clientY/window.innerHeight)*2+1;
    ray.setFromCamera(ptr,camera);
    const hit=ray.intersectObjects(landMeshes,false)[0];
    if(hit){ hov.visible=true; const c=hit.object.userData.cell; hov.position.set(c.x,c.topY+0.08,c.z); renderer.domElement.style.cursor='pointer'; }
    else { hov.visible=false; renderer.domElement.style.cursor='grab'; }
  });
}
animate();

window.addEventListener('resize', ()=>{
  aspect=window.innerWidth/window.innerHeight;
  camera.left=-frustum*aspect/2; camera.right=frustum*aspect/2;
  camera.top=frustum/2; camera.bottom=-frustum/2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loader').style.opacity='0';
setTimeout(()=>document.getElementById('loader').remove(),800);
</script>
