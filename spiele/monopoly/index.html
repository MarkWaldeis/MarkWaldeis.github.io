<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monopoly — Multiplayer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
</head>
<body>

<!-- START -->
<div id="screen-start" class="screen">
  <div class="start-card">
    <div class="logo">
      <div class="logo-banner">MONOPOLY</div>
      <div class="logo-sub">deutsche Ausgabe · online mit Freunden</div>
    </div>
    <input id="input-name" maxlength="16" placeholder="Dein Name">
    <div id="online-block">
      <button id="btn-create" class="btn big red">Neues Spiel erstellen</button>
      <div class="join-row">
        <input id="input-code" maxlength="4" placeholder="CODE">
        <button id="btn-join" class="btn big green">Beitreten</button>
      </div>
    </div>
    <div id="start-error" class="error"></div>
    <div class="hint">Host erstellt einen Raum → Code oder Link an Freunde schicken. 2–6 Spieler.</div>
  </div>
</div>

<!-- LOBBY -->
<div id="screen-lobby" class="screen hidden">
  <div class="start-card">
    <div class="logo"><div class="logo-banner small">MONOPOLY</div></div>
    <div class="code-box">
      <div class="code-label">Raum-Code</div>
      <div id="lobby-code" class="code-value"></div>
      <button id="btn-copy" class="btn">Link kopieren</button>
    </div>
    <ul id="lobby-players"></ul>
    <div id="lobby-wait" class="hint"></div>
    <button id="btn-start-game" class="btn big green">Spiel starten</button>
    <button id="btn-leave-lobby" class="btn subtle">Verlassen</button>
  </div>
</div>

<!-- SPIEL -->
<div id="screen-game" class="screen hidden">
  <div id="game-wrap">
    <div id="board-area">
      <div id="board">
        <div id="board-center">
          <div class="center-logo">MONOPOLY</div>
          <div id="dice-row">
            <div class="die" id="die1"><span></span></div>
            <div class="die" id="die2"><span></span></div>
          </div>
          <div id="center-status"></div>
          <div id="log-box"></div>
        </div>
      </div>
    </div>
    <div id="side-panel">
      <div id="turn-banner"></div>
      <div id="action-row">
        <button id="btn-roll" class="btn big red hidden">🎲 Würfeln</button>
        <button id="btn-jail-pay" class="btn hidden">50 € zahlen</button>
        <button id="btn-jail-card" class="btn hidden">Karte nutzen</button>
        <button id="btn-buy" class="btn big green hidden">Kaufen</button>
        <button id="btn-auction" class="btn hidden">Versteigern</button>
        <button id="btn-end" class="btn big hidden">Zug beenden</button>
        <button id="btn-trade" class="btn hidden">🤝 Handel</button>
        <button id="btn-manage" class="btn hidden">🏠 Bauen / Hypothek</button>
        <button id="btn-bankrupt" class="btn hidden">Konkurs erklären</button>
      </div>
      <div id="players-list"></div>
      <div id="my-props"></div>
      <button id="btn-leave-game" class="btn subtle">Verlassen</button>
    </div>
  </div>
</div>

<!-- Karte gezogen -->
<div id="modal-card" class="overlay hidden">
  <div class="drawn-card" id="drawn-card">
    <div class="dc-type"></div>
    <div class="dc-text"></div>
    <div class="dc-ok">antippen zum Schließen</div>
  </div>
</div>

<!-- Auktion -->
<div id="modal-auction" class="overlay hidden">
  <div class="modal-card">
    <h3>Versteigerung</h3>
    <div id="auction-prop" class="auction-prop"></div>
    <div id="auction-high" class="auction-high"></div>
    <div class="bid-row">
      <button class="bid-amt" data-add="10">+10</button>
      <button class="bid-amt" data-add="50">+50</button>
      <button class="bid-amt" data-add="100">+100</button>
    </div>
    <button id="btn-bid" class="btn big green">Bieten</button>
    <button id="btn-pass-auction" class="btn">Passen</button>
    <div id="auction-status" class="hint"></div>
  </div>
</div>

<!-- Handel -->
<div id="modal-trade" class="overlay hidden">
  <div class="modal-card wide">
    <h3>Handel anbieten</h3>
    <div class="trade-cols">
      <div class="trade-col">
        <div class="trade-head">Du gibst</div>
        <select id="trade-to"></select>
        <div id="trade-give" class="trade-props"></div>
        <label class="trade-money">Geld: <input id="trade-give-money" type="number" min="0" value="0"></label>
        <label id="trade-give-card-row" class="trade-check"><input type="checkbox" id="trade-give-card"> Gefängnisfrei-Karte</label>
      </div>
      <div class="trade-col">
        <div class="trade-head">Du bekommst</div>
        <div id="trade-take" class="trade-props"></div>
        <label class="trade-money">Geld: <input id="trade-take-money" type="number" min="0" value="0"></label>
        <label id="trade-take-card-row" class="trade-check"><input type="checkbox" id="trade-take-card"> Gefängnisfrei-Karte</label>
      </div>
    </div>
    <button id="btn-send-trade" class="btn big green">Angebot senden</button>
    <button id="btn-cancel-trade" class="btn">Abbrechen</button>
  </div>
</div>

<!-- Handel eingehend -->
<div id="modal-trade-in" class="overlay hidden">
  <div class="modal-card">
    <h3>Handelsangebot</h3>
    <div id="trade-in-body"></div>
    <button id="btn-accept-trade" class="btn big green">Annehmen</button>
    <button id="btn-decline-trade" class="btn">Ablehnen</button>
  </div>
</div>

<!-- Grundstück verwalten -->
<div id="modal-manage" class="overlay hidden">
  <div class="modal-card wide">
    <h3>Meine Grundstücke</h3>
    <div id="manage-list"></div>
    <button id="btn-close-manage" class="btn">Schließen</button>
  </div>
</div>

<!-- Spielende -->
<div id="modal-end" class="overlay hidden">
  <div class="modal-card">
    <h2 id="end-title"></h2>
    <button id="btn-again" class="btn big green">Nochmal spielen</button>
    <button id="btn-end-leave" class="btn">Zur Lobby</button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="firebase-config.js"></script>
<script src="mono-engine.js"></script>
<script src="game.js"></script>
</body>
</html>
