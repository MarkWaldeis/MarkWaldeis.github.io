</style>
<script type="importmap">
{ "imports": {

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* ============ RENDERER / SCENE / CAMERA (100mm macro f/2.8) ============ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030304);
scene.fog = new THREE.FogExp2(0x030304, 0.028);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0.6, 1.1, 9.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.2;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.62;

RectAreaLightUniformsLib.init();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ============ LIGHTS — dark studio + cross-polarized rim ============ */
scene.add(new THREE.AmbientLight(0x11131a, 0.6));

const keyTop = new THREE.SpotLight(0xffffff, 90, 40, 0.32, 0.45, 1.6);
keyTop.position.set(1.5, 9, 2.5);
keyTop.castShadow = true;
keyTop.shadow.mapSize.set(2048,2048);
keyTop.shadow.bias = -0.0004;
scene.add(keyTop);

const rimL = new THREE.SpotLight(0x7ae8ff, 160, 40, 0.5, 0.6, 1.7);
rimL.position.set(-7.5, 2.2, -4.5);
scene.add(rimL);

const rimR = new THREE.SpotLight(0xff9a5a, 120, 40, 0.5, 0.6, 1.7);
rimR.position.set(7.5, 1.4, -5.0);
scene.add(rimR);

const backRectA = new THREE.RectAreaLight(0xbfefff, 9.0, 8, 8);
backRectA.position.set(-4, 3, -7);
backRectA.lookAt(0,0.5,0);
scene.add(backRectA);

const backRectB = new THREE.RectAreaLight(0xffe0b8, 6.0, 7, 7);
backRectB.position.set(4.5, 2, -7);
backRectB.lookAt(0,0.5,0);
scene.add(backRectB);

const underGlow = new THREE.PointLight(0x88ddff, 6, 12, 2);
underGlow.position.set(0, -1.6, 1.2);
scene.add(underGlow);

const bioLight = new THREE.PointLight(0x36f6ff, 8, 6, 2);
bioLight.position.set(0, 0.35, 0);
scene.add(bioLight);

/* ============ HELPERS ============ */
function radialSprite(inner='rgba(255,255,255,1)', outer='rgba(255,255,255,0)'){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,inner); gr.addColorStop(0.35,inner); gr.addColorStop(1,outer);
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function oilSwirlTex(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#06060c'; g.fillRect(0,0,512,512);
  for(let i=0;i<70;i++){
    const x=Math.random()*512,y=Math.random()*512,r=20+Math.random()*120;
    const hue=Math.random()*360;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`hsla(${hue},90%,55%,0.28)`);
    gr.addColorStop(0.5,`hsla(${(hue+60)%360},85%,40%,0.12)`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.globalCompositeOperation='lighter';
  for(let i=0;i<40;i++){
    g.strokeStyle=`hsla(${Math.random()*360},95%,60%,0.16)`;
    g.lineWidth=1+Math.random()*3;
    g.beginPath();
    const y=Math.random()*512;
    g.moveTo(0,y);
    g.bezierCurveTo(170,y+Math.random()*80-40,340,y+Math.random()*80-40,512,y+Math.random()*60-30);
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const swirlMap = oilSwirlTex();

/* ============ GROUND + CAUSTICS (chromatic dispersion) ============ */
const causticUniforms = {
  uTime:{value:0},
  uDeep:{value:new THREE.Color(0x050507)},
  uCyan:{value:new THREE.Color(0x46f0ff)},
  uMagenta:{value:new THREE.Color(0xff4fd8)},
  uAmber:{value:new THREE.Color(0xffb45e)},
};
const groundMat = new THREE.ShaderMaterial({
  uniforms: causticUniforms,
  vertexShader:`
    varying vec2 vUv; varying vec3 vWorld;
    void main(){
      vUv=uv;
      vec4 w=modelMatrix*vec4(position,1.0);
      vWorld=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader:`
    varying vec2 vUv; varying vec3 vWorld;
    uniform float uTime; uniform vec3 uDeep,uCyan,uMagenta,uAmber;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
    float caustic(vec2 uv, float t){
      vec2 p = uv*7.0;
      float c = 0.0;
      c += 1.0-abs(sin(p.x+sin(p.y+t*0.4)+sin((p.x+p.y)*0.5+t*0.3)));
      c += 1.0-abs(sin(p.y+sin(p.x-t*0.35)));
      c *= 0.5;
      c = pow(clamp(c*0.62,0.0,1.0), 5.0);
      float web = noise(uv*22.0+t*0.12)*noise(uv*17.0-t*0.1);
      c *= (0.55+0.9*web);
      return c;
    }
    void main(){
      vec2 uv = vUv-0.5;
      float r = length(uv)*2.0;
      vec3 base = mix(vec3(0.015,0.015,0.02), uDeep, smoothstep(1.2,0.2,r));
      // chromatic offsets -> prism split
      float e=0.006;
      float cr = caustic(vUv+vec2(e,0.0), uTime);
      float cg = caustic(vUv, uTime*1.03);
      float cb = caustic(vUv-vec2(e,0.0), uTime*0.97);
      float fall = exp(-r*r*2.6);
      vec3 rainbow = vec3(cr,cg,cb)*2.4*fall;
      // tint caustic web: cyan core, magenta/amber fringes
      vec3 tint = (uCyan*cg + uMagenta*(cr-cg) + uAmber*(cb*0.5)) * fall * 1.4;
      vec3 col = base + rainbow*0.55 + tint*0.75;
      // soft top-light pool
      col += vec3(0.10,0.11,0.13)*exp(-r*r*1.1)*0.7;
      // vignette to black
      col *= smoothstep(1.35,0.45,r);
      gl_FragColor = vec4(col,1.0);
    }`
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2.35;
ground.receiveShadow = true;
scene.add(ground);

/* ============ CORE GLASS SPHERE (unbroken, borosilicate) ============ */
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.035,
  transmission: 1.0,
  thickness: 2.2,
  ior: 1.47,
  attenuationColor: new THREE.Color(0xd8f4ff),
  attenuationDistance: 6.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  iridescence: 0.22,
  iridescenceIOR: 1.32,
  specularIntensity: 1.2,
  envMapIntensity: 1.6,
  transparent: true,
});
const core = new THREE.Mesh(new THREE.SphereGeometry(1.8, 96, 64), glassMat);
core.position.set(0, 0.35, 0);
core.castShadow = true;
scene.add(core);

// thin oily film clinging to top of sphere
const filmMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a14, roughness: 0.12, metalness: 0.25,
  clearcoat: 1, clearcoatRoughness: 0.08,
  iridescence: 1.0, iridescenceIOR: 2.1,
  iridescenceThicknessRange: [120, 850],
  iridescenceMap: swirlMap,
  transparent: true, opacity: 0.92,
  envMapIntensity: 1.8,
});
const film = new THREE.Mesh(new THREE.SphereGeometry(1.83, 64, 32, 0, Math.PI*2, 0, Math.PI*0.42), filmMat);
film.position.copy(core.position);
film.rotation.x = 0.15;
scene.add(film);

/* ============ INTERNAL MICRO-WORLD: JELLYFISH ============ */
const jelly = new THREE.Group();
jelly.position.copy(core.position);
scene.add(jelly);

const bellMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2fbff, roughness: 0.28, transmission: 0.92, thickness: 0.7,
  ior: 1.34, transparent: true, opacity: 0.95,
  emissive: 0x1ac8e8, emissiveIntensity: 0.28,
  clearcoat: 1, side: THREE.DoubleSide, depthWrite: false,
});
const bell = new THREE.Mesh(new THREE.SphereGeometry(0.62, 48, 24, 0, Math.PI*2, 0, Math.PI*0.58), bellMat);
bell.position.y = 0.32;
jelly.add(bell);

const bellRimMat = new THREE.MeshBasicMaterial({ color: 0x9ef6ff, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
const bellRim = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.012, 8, 64), bellRimMat);
bellRim.rotation.x = Math.PI/2;
bellRim.position.y = 0.32 + 0.62*Math.cos(Math.PI*0.58);
jelly.add(bellRim);

const organMat = new THREE.MeshStandardMaterial({ color:0xffd9e8, emissive:0xff6aa8, emissiveIntensity:0.9, roughness:0.4, transparent:true, opacity:0.85 });
for(let i=0;i<4;i++){
  const o = new THREE.Mesh(new THREE.SphereGeometry(0.10+Math.random()*0.05, 16, 12), organMat);
  const a = (i/4)*Math.PI*2;
  o.position.set(Math.cos(a)*0.16, 0.52, Math.sin(a)*0.16);
  jelly.add(o);
}
const coreGlowMat = new THREE.MeshBasicMaterial({ color:0x66f6ff, transparent:true, opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false });
const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 16), coreGlowMat);
coreGlow.position.y = 0.22;
jelly.add(coreGlow);

// hundreds of hair-thin non-overlapping tentacles
{
  const segs = [];
  const N = 240;
  for(let i=0;i<N;i++){
    const ring = i % 3;
    const rr = ring===0 ? 0.48 : ring===1 ? 0.34 : 0.16;
    const a = (i/N)*Math.PI*2 + (Math.random()-0.5)*0.02;
    const sx = Math.cos(a)*rr, sz = Math.sin(a)*rr;
    const sy = 0.32 + 0.62*Math.cos(Math.PI*0.58) + 0.02;
    const len = 0.9 + Math.random()*1.3 + (ring===2?0.4:0);
    const sway = (Math.random()-0.5)*0.35;
    const sway2 = (Math.random()-0.5)*0.35;
    const mx = sx+sway*0.4, mz = sz+sway2*0.4, my = sy-len*0.55;
    const ex = sx+sway, ez = sz+sway2, ey = sy-len;
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(sx,sy,sz),
      new THREE.Vector3(mx,my,mz),
      new THREE.Vector3(ex,ey,ez)
    );
    const pts = curve.getPoints(7);
    for(let k=0;k<pts.length-1;k++){ segs.push(pts[k].x,pts[k].y,pts[k].z, pts[k+1].x,pts[k+1].y,pts[k+1].z); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(segs,3));
  const m = new THREE.LineBasicMaterial({ color:0x7df3ff, transparent:true, opacity:0.62, blending:THREE.AdditiveBlending, depthWrite:false });
  const lines = new THREE.LineSegments(g, m);
  lines.userData.isTentacles = true;
  jelly.add(lines);

  // few thicker oral arms
  const armMat = new THREE.MeshPhysicalMaterial({ color:0xeafcff, roughness:0.35, transmission:0.7, thickness:0.3, transparent:true, opacity:0.7, emissive:0x2adfff, emissiveIntensity:0.35, side:THREE.DoubleSide });
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const pts=[ new THREE.Vector3(Math.cos(a)*0.12,0.42,Math.sin(a)*0.12),
                new THREE.Vector3(Math.cos(a)*0.22,0.05,Math.sin(a)*0.22),
                new THREE.Vector3(Math.cos(a+0.4)*0.28,-0.5,Math.sin(a+0.4)*0.28) ];
    const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),20,0.022,6), armMat);
    jelly.add(tube);
  }
}

/* ============ SHATTERED FRAGMENTS (razor geometric, dispersive) ============ */
const shardMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness:0, roughness:0.02,
  transmission:1.0, thickness:0.35, ior:1.52,
  clearcoat:1, clearcoatRoughness:0.02,
  iridescence:0.85, iridescenceIOR:1.45,
  iridescenceThicknessRange:[100,900],
  attenuationColor:new THREE.Color(0xcfefff), attenuationDistance:4,
  envMapIntensity:2.0, transparent:true,
  side:THREE.DoubleSide, flatShading:true,
});
const shards = new THREE.Group();
scene.add(shards);
const shardData = [];
{
  const dummy = new THREE.Object3D();
  for(let i=0;i<78;i++){
    const sz = 0.08 + Math.pow(Math.random(),1.6)*0.55;
    let geo;
    const kind = Math.random();
    if(kind<0.5) geo = new THREE.TetrahedronGeometry(sz, 0);
    else if(kind<0.8) geo = new THREE.OctahedronGeometry(sz, 0);
    else geo = new THREE.BoxGeometry(sz, sz*0.18, sz*0.65);
    // razor stretch
    geo.scale(1, 0.35+Math.random()*0.5, 1+Math.random()*1.4);
    const mesh = new THREE.Mesh(geo, shardMat);
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    const R = 1.85 + Math.random()*0.9;
    const px = R*Math.sin(phi)*Math.cos(theta);
    const py = 0.35 + R*Math.cos(phi)*0.9;
    const pz = R*Math.sin(phi)*Math.sin(theta);
    mesh.position.set(px,py,pz);
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    mesh.castShadow = true;
    const dir = new THREE.Vector3(px, py-0.35, pz).normalize();
    shardData.push({ mesh, dir, dist:R-1.8, spin:new THREE.Vector3((Math.random()-0.5)*1.2,(Math.random()-0.5)*1.2,(Math.random()-0.5)*1.2), base:mesh.position.clone() });
    shards.add(mesh);
    dummy.updateMatrix();
  }
  // prism edge glints: tiny additive edges on biggest shards
  const edgeMat = new THREE.LineBasicMaterial({ color:0xd8f6ff, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending });
  shardData.slice(0,22).forEach(s=>{
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(s.mesh.geometry), edgeMat);
    s.mesh.add(e);
  });
}

/* ============ OIL DROPLET + SPLASH CROWN + MICRO-DROPLETS ============ */
const oilMat = new THREE.MeshPhysicalMaterial({
  color: 0x07070e, roughness: 0.1, metalness: 0.35,
  clearcoat: 1, clearcoatRoughness: 0.06,
  iridescence: 1.0, iridescenceIOR: 2.3,
  iridescenceThicknessRange: [80, 900],
  iridescenceMap: swirlMap,
  envMapIntensity: 1.9,
});
const oilGroup = new THREE.Group();
scene.add(oilGroup);

// main falling viscous droplet (deformed: sphere + tail)
const drop = new THREE.Group();
drop.position.set(0.1, 4.1, 0);
const dropBody = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 24), oilMat);
dropBody.scale.set(1, 1.45, 1);
dropBody.castShadow = true;
drop.add(dropBody);
const dropTail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.22, 0.9, 16), oilMat);
dropTail.position.y = 0.75;
drop.add(dropTail);
const dropTip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), oilMat);
dropTip.position.y = 1.2;
drop.add(dropTip);
oilGroup.add(drop);

// splash crown at impact point (top of sphere)
function makeCrown(){
  const pts=[];
  for(let i=0;i<=20;i++){
    const t=i/20;
    const r=0.18+t*1.05;
    const y=t*0.72 - Math.pow(t,2.0)*0.12;
    pts.push(new THREE.Vector2(r,y));
  }
  const geo=new THREE.LatheGeometry(pts, 96);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const ang=Math.atan2(z,x);
    const rad=Math.hypot(x,z);
    const crownH = Math.max(0,(rad-0.35)/1.0);
    const spikes = Math.sin(ang*12)*0.5 + Math.sin(ang*7+1.3)*0.3 + Math.sin(ang*23)*0.2;
    const lift = spikes*0.32*crownH*crownH;
    const pinch = 1 + spikes*0.08*crownH;
    pos.setX(i, x*pinch);
    pos.setZ(i, z*pinch);
    pos.setY(i, y+lift);
  }
  geo.computeVertexNormals();
  return geo;
}
const crown = new THREE.Mesh(makeCrown(), oilMat);
crown.position.set(0.05, 1.95, 0);
crown.castShadow = true;
oilGroup.add(crown);

// crown rim beads (surface-tension spheres on spike tips)
{
  const beadGeo = new THREE.SphereGeometry(1, 12, 10);
  const beads = new THREE.InstancedMesh(beadGeo, oilMat, 26);
  const d = new THREE.Object3D();
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2;
    const rad=1.05+Math.random()*0.25;
    const h=0.62+ (Math.sin(a*12)*0.5+Math.sin(a*7+1.3)*0.3)*0.32*((rad-0.35));
    d.position.set(0.05+Math.cos(a)*rad, 1.95+h, Math.sin(a)*rad);
    d.scale.setScalar(0.04+Math.random()*0.07);
    d.updateMatrix();
    beads.setMatrixAt(i,d.matrix);
  }
  beads.castShadow=true;
  oilGroup.add(beads);
}

// micro-droplets breaking off (frozen mid-air)
const microData=[];
{
  const mg=new THREE.SphereGeometry(1, 14, 12);
  const inst=new THREE.InstancedMesh(mg, oilMat, 90);
  const d=new THREE.Object3D();
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2;
    const rr=0.6+Math.random()*2.1;
    const yy=2.0+Math.random()*2.4;
    const s=0.015+Math.pow(Math.random(),2.2)*0.11;
    d.position.set(Math.cos(a)*rr*0.9, yy, Math.sin(a)*rr*0.9);
    d.scale.set(s, s*(0.8+Math.random()*0.9), s);
    d.updateMatrix();
    inst.setMatrixAt(i,d.matrix);
    microData.push({ x:d.position.x, y:d.position.y, z:d.position.z, s, ph:Math.random()*6.28 });
  }
  inst.instanceMatrix.needsUpdate=true;
  oilGroup.add(inst);
  oilGroup.userData.microMesh = inst;
}

/* ============ GLASS DUST + BOKEH SPECKS ============ */
let dustGeo, dustPts;
{
  const N=900;
  const p=new Float32Array(N*3);
  const a=new Float32Array(N);
  for(let i=0;i<N;i++){
    const r=1.5+Math.random()*6.5;
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th);
    p[i*3+1]=-1.5+Math.random()*6.5;
    p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    a[i]=Math.random();
  }
  dustGeo=new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(p,3));
  dustGeo.setAttribute('aRand', new THREE.BufferAttribute(a,1));
  const dustMat=new THREE.PointsMaterial({
    size:0.055, map:radialSprite(), transparent:true, opacity:0.75,
    color:0xfff2d8, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true,
  });
  dustPts=new THREE.Points(dustGeo,dustMat);
  scene.add(dustPts);
}
// few large sharp bokeh discs
{
  const bokehTex = radialSprite('rgba(255,240,210,0.9)','rgba(255,240,210,0)');
  for(let i=0;i<26;i++){
    const sm=new THREE.SpriteMaterial({ map:bokehTex, transparent:true, opacity:0.08+Math.random()*0.16, depthWrite:false, blending:THREE.AdditiveBlending });
    const sp=new THREE.Sprite(sm);
    sp.position.set((Math.random()-0.5)*12, -1+Math.random()*6, -3-Math.random()*5);
    const s=0.25+Math.random()*0.9;
    sp.scale.set(s,s,1);
    sp.userData.ph=Math.random()*6.28;
    sp.userData.baseY=sp.position.y;
    sp.userData.isBokeh=true;
    scene.add(sp);
  }
}

/* ============ VOLUMETRIC BEAMS (fake) ============ */
{
  const beamMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    uniforms:{ uColor:{value:new THREE.Color(0x9ae8ff)}, uOp:{value:0.10} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec2 vUv; uniform vec3 uColor; uniform float uOp;
      void main(){
        float a = smoothstep(0.0,0.35,vUv.y)*smoothstep(1.0,0.35,vUv.y);
        a *= smoothstep(0.0,0.25,vUv.x)*smoothstep(1.0,0.75,vUv.x);
        gl_FragColor=vec4(uColor, a*uOp);
      }`
  });
  const beamL=new THREE.Mesh(new THREE.ConeGeometry(3.2,10,24,1,true), beamMat.clone());
  beamL.position.set(-5.2,3.4,-3.5); beamL.rotation.z=0.9; beamL.rotation.x=0.2;
  scene.add(beamL);
  const beamR=beamL.clone();
  beamR.position.set(5.2,3.0,-3.8); beamR.rotation.z=-0.9;
  beamR.material.uniforms.uColor.value=new THREE.Color(0xffc890);
  scene.add(beamR);
}

/* ============ POST: BLOOM + MACRO BOKEN (f/2.8) ============ */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight), 0.55, 0.65, 0.62);
composer.addPass(bloom);
const bokeh=new BokehPass(scene,camera,{ focus:9.0, aperture:0.0016, maxblur:0.0085 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

/* ============ ANIMATE — frozen high-speed, ultra slow drift ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const ts=t*0.28; // slow-motion time

  causticUniforms.uTime.value=t*0.55;

  // jelly pulse + float
  const pulse=1+Math.sin(t*1.8)*0.035;
  jelly.scale.set(pulse, 1/Math.sqrt(pulse), pulse);
  jelly.position.y=core.position.y+Math.sin(t*0.9)*0.05;
  jelly.rotation.y=ts*0.35;
  bioLight.intensity=7+Math.sin(t*2.4)*1.6;
  bell.material.emissiveIntensity=0.24+Math.sin(t*2.0)*0.10;

  // shards: suspended + micro rotation (frozen shatter)
  for(const s of shardData){
    const w=Math.sin(ts*0.7+s.base.x*3.1+s.base.y*2.2)*0.06;
    s.mesh.position.copy(s.base).addScaledVector(s.dir, w + Math.sin(ts*0.4+s.dist*4.0)*0.03);
    s.mesh.rotation.x+=s.spin.x*0.0022;
    s.mesh.rotation.y+=s.spin.y*0.0022;
    s.mesh.rotation.z+=s.spin.z*0.0022;
  }

  // oil: viscous shimmer, crown breathing, droplet hover
  drop.position.y=4.1+Math.sin(t*0.7)*0.07;
  dropBody.scale.y=1.45+Math.sin(t*3.2)*0.03;
  crown.scale.set(1+Math.sin(t*2.2)*0.008, 1+Math.sin(t*2.8)*0.012, 1+Math.sin(t*2.2)*0.008);
  oilMat.iridescenceIOR=2.3+Math.sin(t*0.5)*0.08;

  // dust drift catching light
  const dp=dustGeo.attributes.position;
  for(let i=0;i<dp.count;i+=3){
    dp.array[i+1]+=Math.sin(t*0.5+i)*0.0006;
    dp.array[i]+=Math.cos(t*0.3+i*0.7)*0.0005;
  }
  dp.needsUpdate=true;
  dustPts.rotation.y=ts*0.02;

  // bokeh float
  scene.traverse(o=>{ if(o.userData && o.userData.isBokeh){ o.position.y=o.userData.baseY+Math.sin(t*0.4+o.userData.ph)*0.3; } });

  // subtle camera breathing (handheld macro)
  camera.position.x=0.6+Math.sin(t*0.22)*0.08;
  camera.position.y=1.1+Math.sin(t*0.3)*0.06;

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
const loader=document.getElementById('loader');
loader.style.opacity='0';
setTimeout(()=>loader.remove(),1200);
</script>
