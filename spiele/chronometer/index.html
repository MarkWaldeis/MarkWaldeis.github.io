<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* ============ RENDERER / SCENE / CAMERA (100mm macro f/2.8) ============ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030304);
scene.fog = new THREE.FogExp2(0x030304, 0.028);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0.6, 1.1, 9.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.2;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
// pause auto-orbit while the user drags, resume after 6s idle
let idleTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; if (idleTimer) clearTimeout(idleTimer); });
controls.addEventListener('end', () => { idleTimer = setTimeout(() => { controls.autoRotate = true; }, 6000); });

RectAreaLightUniformsLib.init();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ============ LIGHTS — dark studio + cross-polarized rim ============ */
scene.add(new THREE.AmbientLight(0x11131a, 0.6));

const keyTop = new THREE.SpotLight(0xffffff, 90, 40, 0.32, 0.45, 1.6);
keyTop.position.set(1.5, 9, 2.5);
keyTop.castShadow = true;
keyTop.shadow.mapSize.set(2048,2048);
keyTop.shadow.bias = -0.0004;
scene.add(keyTop);

const rimL = new THREE.SpotLight(0x7ae8ff, 160, 40, 0.5, 0.6, 1.7);
rimL.position.set(-7.5, 2.2, -4.5);
scene.add(rimL);

const rimR = new THREE.SpotLight(0xff9a5a, 120, 40, 0.5, 0.6, 1.7);
rimR.position.set(7.5, 1.4, -5.0);
scene.add(rimR);

const backRectA = new THREE.RectAreaLight(0xbfefff, 9.0, 8, 8);
backRectA.position.set(-4, 3, -7);
backRectA.lookAt(0,0.5,0);
scene.add(backRectA);

const backRectB = new THREE.RectAreaLight(0xffe0b8, 6.0, 7, 7);
backRectB.position.set(4.5, 2, -7);
backRectB.lookAt(0,0.5,0);
scene.add(backRectB);

const underGlow = new THREE.PointLight(0x88ddff, 6, 12, 2);
underGlow.position.set(0, -1.6, 1.2);
scene.add(underGlow);

const bioLight = new THREE.PointLight(0x36f6ff, 8, 6, 2);
bioLight.position.set(0, 0.35, 0);
scene.add(bioLight);

// warm accent kiss on the oil crown (subtle shimmer in animate)
const crownGlow = new THREE.PointLight(0xffa04e, 2.6, 7, 2);
crownGlow.position.set(0.4, 2.6, 0.9);
scene.add(crownGlow);

/* ============ HELPERS ============ */
function radialSprite(inner='rgba(255,255,255,1)', outer='rgba(255,255,255,0)'){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,inner); gr.addColorStop(0.35,inner); gr.addColorStop(1,outer);
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function oilSwirlTex(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#06060c'; g.fillRect(0,0,512,512);
  for(let i=0;i<70;i++){
    const x=Math.random()*512,y=Math.random()*512,r=20+Math.random()*120;
    const hue=Math.random()*360;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`hsla(${hue},90%,55%,0.28)`);
    gr.addColorStop(0.5,`hsla(${(hue+60)%360},85%,40%,0.12)`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.globalCompositeOperation='lighter';
  for(let i=0;i<40;i++){
    g.strokeStyle=`hsla(${Math.random()*360},95%,60%,0.16)`;
    g.lineWidth=1+Math.random()*3;
    g.beginPath();
    const y=Math.random()*512;
    g.moveTo(0,y);
    g.bezierCurveTo(170,y+Math.random()*80-40,340,y+Math.random()*80-40,512,y+Math.random()*60-30);
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const swirlMap = oilSwirlTex();

// soft ambient aura far behind the subject — lifts the pure-black backdrop
{
  const auraTex = radialSprite('rgba(70,140,190,0.55)', 'rgba(20,30,60,0)');
  const aura = new THREE.Sprite(new THREE.SpriteMaterial({
    map: auraTex, transparent: true, opacity: 0.16,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  aura.position.set(0, 1.2, -10);
  aura.scale.set(18, 13, 1);
  scene.add(aura);
}

/* ============ GROUND + CAUSTICS (chromatic dispersion) ============ */
const causticUniforms = {
  uTime:{value:0},
  uDeep:{value:new THREE.Color(0x050507)},
  uCyan:{value:new THREE.Color(0x46f0ff)},
  uMagenta:{value:new THREE.Color(0xff4fd8)},
  uAmber:{value:new THREE.Color(0xffb45e)},
};
const groundMat = new THREE.ShaderMaterial({
  uniforms: causticUniforms,
  vertexShader:`
    varying vec2 vUv; varying vec3 vWorld;
    void main(){
      vUv=uv;
      vec4 w=modelMatrix*vec4(position,1.0);
      vWorld=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader:`
    varying vec2 vUv; varying vec3 vWorld;
    uniform float uTime; uniform vec3 uDeep,uCyan,uMagenta,uAmber;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
    float caustic(vec2 uv, float t){
      vec2 p = uv*7.0;
      float c = 0.0;
      c += 1.0-abs(sin(p.x+sin(p.y+t*0.4)+sin((p.x+p.y)*0.5+t*0.3)));
      c += 1.0-abs(sin(p.y+sin(p.x-t*0.35)));
      c *= 0.5;
      c = pow(clamp(c*0.62,0.0,1.0), 5.0);
      float web = noise(uv*22.0+t*0.12)*noise(uv*17.0-t*0.1);
      c *= (0.55+0.9*web);
      return c;
    }
    void main(){
      vec2 uv = vUv-0.5;
      float r = length(uv)*2.0;
      vec3 base = mix(vec3(0.015,0.015,0.02), uDeep, smoothstep(1.2,0.2,r));
      // chromatic offsets -> prism split
      float e=0.006;
      float cr = caustic(vUv+vec2(e,0.0), uTime);
      float cg = caustic(vUv, uTime*1.03);
      float cb = caustic(vUv-vec2(e,0.0), uTime*0.97);
      float fall = exp(-r*r*2.6);
      vec3 rainbow = vec3(cr,cg,cb)*2.4*fall;
      // tint caustic web: cyan core, magenta/amber fringes
      vec3 tint = (uCyan*cg + uMagenta*(cr-cg) + uAmber*(cb*0.5)) * fall * 1.4;
      vec3 col = base + rainbow*0.55 + tint*0.75;
      // soft top-light pool
      col += vec3(0.10,0.11,0.13)*exp(-r*r*1.1)*0.7;
      // vignette to black
      col *= smoothstep(1.35,0.45,r);
      gl_FragColor = vec4(col,1.0);
    }`
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2.35;
ground.receiveShadow = true;
scene.add(ground);

/* ============ CORE GLASS SPHERE (unbroken, borosilicate) ============ */
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.035,
  transmission: 1.0,
  thickness: 2.2,
  ior: 1.47,
  attenuationColor: new THREE.Color(0xd8f4ff),
  attenuationDistance: 6.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  iridescence: 0.22,
  iridescenceIOR: 1.32,
  specularIntensity: 1.2,
  envMapIntensity: 1.6,
  transparent: true,
});
const core = new THREE.Mesh(new THREE.SphereGeometry(1.8, 96, 64), glassMat);
core.position.set(0, 0.35, 0);
core.castShadow = true;
scene.add(core);

// thin oily film clinging to top of sphere
const filmMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a14, roughness: 0.12, metalness: 0.25,
  clearcoat: 1, clearcoatRoughness: 0.08,
  iridescence: 1.0, iridescenceIOR: 2.1,
  iridescenceThicknessRange: [120, 850],
  iridescenceMap: swirlMap,
  transparent: true, opacity: 0.92,
  envMapIntensity: 1.8,
});
const film = new THREE.Mesh(new THREE.SphereGeometry(1.83, 64, 32, 0, Math.PI*2, 0, Math.PI*0.42), filmMat);
film.position.copy(core.position);
film.rotation.x = 0.15;
scene.add(film);

/* ============ INTERNAL MICRO-WORLD: JELLYFISH ============ */
const jelly = new THREE.Group();
jelly.position.copy(core.position);
scene.add(jelly);

const bellMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2fbff, roughness: 0.28, transmission: 0.92, thickness: 0.7,
  ior: 1.34, transparent: true, opacity: 0.95,
  emissive: 0x1ac8e8, emissiveIntensity: 0.28,
  clearcoat: 1, side: THREE.DoubleSide, depthWrite: false,
});
const bell = new THREE.Mesh(new THREE.SphereGeometry(0.62, 48, 24, 0, Math.PI*2, 0, Math.PI*0.58), bellMat);
bell.position.y = 0.32;
jelly.add(bell);

const bellRimMat = new THREE.MeshBasicMaterial({ color: 0x9ef6ff, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
const bellRim = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.012, 8, 64), bellRimMat);
bellRim.rotation.x = Math.PI/2;
bellRim.position.y = 0.32 + 0.62*Math.cos(Math.PI*0.58);
jelly.add(bellRim);

const organMat = new THREE.MeshStandardMaterial({ color:0xffd9e8, emissive:0xff6aa8, emissiveIntensity:0.9, roughness:0.4, transparent:true, opacity:0.85 });
for(let i=0;i<4;i++){
  const o = new THREE.Mesh(new THREE.SphereGeometry(0.10+Math.random()*0.05, 16, 12), organMat);
  const a = (i/4)*Math.PI*2;
  o.position.set(Math.cos(a)*0.16, 0.52, Math.sin(a)*0.16);
  jelly.add(o);
}
const coreGlowMat = new THREE.MeshBasicMaterial({ color:0x66f6ff, transparent:true, opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false });
const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 16), coreGlowMat);
coreGlow.position.y = 0.22;
jelly.add(coreGlow);

// hundreds of hair-thin non-overlapping tentacles
{
  const segs = [];
  const N = 240;
  for(let i=0;i<N;i++){
    const ring = i % 3;
    const rr = ring===0 ? 0.48 : ring===1 ? 0.34 : 0.16;
    const a = (i/N)*Math.PI*2 + (Math.random()-0.5)*0.02;
    const sx = Math.cos(a)*rr, sz = Math.sin(a)*rr;
    const sy = 0.32 + 0.62*Math.cos(Math.PI*0.58) + 0.02;
    const len = 0.9 + Math.random()*1.3 + (ring===2?0.4:0);
    const sway = (Math.random()-0.5)*0.35;
    const sway2 = (Math.random()-0.5)*0.35;
    const mx = sx+sway*0.4, mz = sz+sway2*0.4, my = sy-len*0.55;
    const ex = sx+sway, ez = sz+sway2, ey = sy-len;
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(sx,sy,sz),
      new THREE.Vector3(mx,my,mz),
      new THREE.Vector3(ex,ey,ez)
    );
    const pts = curve.getPoints(7);
    for(let k=0;k<pts.length-1;k++){ segs.push(pts[k].x,pts[k].y,pts[k].z, pts[k+1].x,pts[k+1].y,pts[k+1].z); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(segs,3));
  const m = new THREE.LineBasicMaterial({ color:0x7df3ff, transparent:true, opacity:0.62, blending:THREE.AdditiveBlending, depthWrite:false });
  const lines = new THREE.LineSegments(g, m);
  lines.userData.isTentacles = true;
  jelly.add(lines);

  // few thicker oral arms
  const armMat = new THREE.MeshPhysicalMaterial({ color:0xeafcff, roughness:0.35, transmission:0.7, thickness:0.3, transparent:true, opacity:0.7, emissive:0x2adfff, emissiveIntensity:0.35, side:THREE.DoubleSide });
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const pts=[ new THREE.Vector3(Math.cos(a)*0.12,0.42,Math.sin(a)*0.12),
                new THREE.Vector3(Math.cos(a)*0.22,0.05,Math.sin(a)*0.22),
                new THREE.Vector3(Math.cos(a+0.4)*0.28,-0.5,Math.sin(a+0.4)*0.28) ];
    const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),20,0.022,6), armMat);
    jelly.add(tube);
  }
}

/* ============ CHRONOMETER DIAL — floating glass bezel + real-time hands ============ */
const dial = new THREE.Group();
dial.position.copy(core.position);
dial.rotation.x = 0.05;
dial.rotation.y = -0.08;
scene.add(dial);

const dialGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.04,
  transmission: 1.0, thickness: 0.12, ior: 1.5,
  clearcoat: 1, clearcoatRoughness: 0.04,
  iridescence: 0.35, iridescenceIOR: 1.4,
  envMapIntensity: 1.7, transparent: true,
});
// outer bezel + a second, slightly tilted hairline ring (depth parallax)
const bezel = new THREE.Mesh(new THREE.TorusGeometry(2.55, 0.032, 20, 180), dialGlass);
bezel.castShadow = true;
dial.add(bezel);
const bezel2 = new THREE.Mesh(new THREE.TorusGeometry(2.72, 0.011, 12, 180), dialGlass);
bezel2.rotation.x = 0.045;
dial.add(bezel2);

// 60 minute ticks + 12 brighter hour markers, pointing inward
{
  const dummy = new THREE.Object3D();
  const minMat = new THREE.MeshStandardMaterial({ color: 0x8fd4e8, emissive: 0x2fb8d8, emissiveIntensity: 0.55, roughness: 0.3, metalness: 0.7 });
  const hrMat  = new THREE.MeshStandardMaterial({ color: 0xffe2b0, emissive: 0xffa040, emissiveIntensity: 1.1,  roughness: 0.25, metalness: 0.6 });
  const minTicks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.014, 0.15, 0.008), minMat, 48);
  const hrTicks  = new THREE.InstancedMesh(new THREE.BoxGeometry(0.034, 0.30, 0.012), hrMat, 12);
  let mi = 0, hi = 0;
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2;
    const isHour = i % 5 === 0;
    const R = isHour ? 2.32 : 2.38;
    dummy.position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
    dummy.rotation.set(0, 0, a - Math.PI / 2);
    dummy.updateMatrix();
    if (isHour) hrTicks.setMatrixAt(hi++, dummy.matrix);
    else minTicks.setMatrixAt(mi++, dummy.matrix);
  }
  minTicks.instanceMatrix.needsUpdate = true;
  hrTicks.instanceMatrix.needsUpdate = true;
  dial.add(minTicks, hrTicks);
}

// dauphine-style tapered hands (sword profile), real-time driven
function dauphineHand(len, w, tail, depth, mat) {
  const s = new THREE.Shape();
  s.moveTo(-w * 0.5, -tail);
  s.lineTo(w * 0.5, -tail);
  s.lineTo(w * 0.22, len * 0.62);
  s.lineTo(0, len);
  s.lineTo(-w * 0.22, len * 0.62);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 2 });
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(geo, mat));
  return grp;
}
const handMatCool = new THREE.MeshStandardMaterial({ color: 0xdff4ff, emissive: 0x74d8f0, emissiveIntensity: 0.7, roughness: 0.2, metalness: 0.85, envMapIntensity: 1.4 });
const handMatWarm = new THREE.MeshStandardMaterial({ color: 0xffd9a0, emissive: 0xff9433, emissiveIntensity: 1.4, roughness: 0.25, metalness: 0.7 });
const hourHand = dauphineHand(1.15, 0.075, 0.22, 0.012, handMatCool);
hourHand.position.z = 0.02;
const minHand = dauphineHand(1.78, 0.052, 0.30, 0.010, handMatCool);
minHand.position.z = 0.045;
const secHand = new THREE.Group();
{
  const needle = new THREE.Mesh(new THREE.BoxGeometry(0.014, 2.28, 0.008), handMatWarm);
  needle.position.y = 0.94;
  secHand.add(needle);
  const counter = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.016, 8, 24), handMatWarm);
  counter.position.y = -0.42;
  secHand.add(counter);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.028, 12, 10), handMatWarm);
  tip.position.y = 2.08;
  secHand.add(tip);
}
secHand.position.z = 0.07;
dial.add(hourHand, minHand, secHand);
// jeweled center cap + halo
{
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.075, 0.05, 20), new THREE.MeshStandardMaterial({ color: 0xc8d4dc, metalness: 1, roughness: 0.22, envMapIntensity: 1.5 }));
  cap.rotation.x = Math.PI / 2;
  cap.position.z = 0.08;
  dial.add(cap);
  const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 10), new THREE.MeshStandardMaterial({ color: 0x550011, emissive: 0xff2050, emissiveIntensity: 1.6, roughness: 0.2 }));
  jewel.position.z = 0.11;
  dial.add(jewel);
  const capHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialSprite('rgba(140,240,255,0.8)', 'rgba(140,240,255,0)'), transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
  capHalo.scale.set(0.5, 0.5, 1);
  capHalo.position.z = 0.12;
  dial.add(capHalo);
}

/* ============ TOURBILLON — beating mechanical heart inside the sphere ============ */
const tbMetal = new THREE.MeshStandardMaterial({ color: 0xc8d4dc, metalness: 1.0, roughness: 0.24, envMapIntensity: 1.6 });
const tbGold  = new THREE.MeshStandardMaterial({ color: 0xd8a860, metalness: 1.0, roughness: 0.3, envMapIntensity: 1.4 });
const tourbillon = new THREE.Group();
tourbillon.position.set(0, core.position.y - 1.30, 0);
scene.add(tourbillon);
const tbCage = new THREE.Group();
tourbillon.add(tbCage);
{
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.018, 12, 64), tbMetal);
  ring.rotation.x = Math.PI / 2;
  tbCage.add(ring);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.012, 10, 48), tbGold);
  ring2.rotation.x = Math.PI / 2;
  ring2.position.y = 0.06;
  tbCage.add(ring2);
  for (let i = 0; i < 3; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.014, 0.03), tbMetal);
    spoke.rotation.y = (i / 3) * Math.PI;
    tbCage.add(spoke);
  }
  const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 10), tbGold);
  tbCage.add(staff);
}
// oscillating balance wheel + hairspring spiral
const balance = new THREE.Group();
balance.position.y = 0.05;
tbCage.add(balance);
{
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.014, 8, 40), tbGold);
  wheel.rotation.x = Math.PI / 2;
  balance.add(wheel);
  for (let i = 0; i < 2; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.01, 0.02), tbGold);
    spoke.rotation.y = i * Math.PI / 2;
    balance.add(spoke);
  }
  // flat spiral hairspring
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const a = i * 0.28, r = 0.02 + i * 0.0011;
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0.02, Math.sin(a) * r));
  }
  const spring = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x8fe8ff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending })
  );
  spring.position.y = 0.04;
  balance.add(spring);
}
// ruby jewels on the cage
const jewelMat = new THREE.MeshStandardMaterial({ color: 0x550011, emissive: 0xff2050, emissiveIntensity: 1.5, roughness: 0.2 });
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * Math.PI * 2;
  const j = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 8), jewelMat);
  j.position.set(Math.cos(a) * 0.42, 0, Math.sin(a) * 0.42);
  tbCage.add(j);
}
// geneva-striped base disc under the cage
const baseDisc = new THREE.Mesh(new THREE.CircleGeometry(0.58, 48), new THREE.MeshStandardMaterial({
  color: 0x8a95a0, metalness: 0.95, roughness: 0.35, map: swirlMap, envMapIntensity: 1.1,
}));
baseDisc.rotation.x = -Math.PI / 2;
baseDisc.position.y = -0.16;
tourbillon.add(baseDisc);

/* ============ SHATTERED FRAGMENTS (razor geometric, dispersive) ============ */
const shardMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness:0, roughness:0.02,
  transmission:1.0, thickness:0.35, ior:1.52,
  clearcoat:1, clearcoatRoughness:0.02,
  iridescence:0.85, iridescenceIOR:1.45,
  iridescenceThicknessRange:[100,900],
  attenuationColor:new THREE.Color(0xcfefff), attenuationDistance:4,
  envMapIntensity:2.0, transparent:true,
  side:THREE.DoubleSide, flatShading:true,
});
const shards = new THREE.Group();
scene.add(shards);
const shardData = [];
{
  for(let i=0;i<78;i++){
    const sz = 0.08 + Math.pow(Math.random(),1.6)*0.55;
    let geo;
    const kind = Math.random();
    if(kind<0.5) geo = new THREE.TetrahedronGeometry(sz, 0);
    else if(kind<0.8) geo = new THREE.OctahedronGeometry(sz, 0);
    else geo = new THREE.BoxGeometry(sz, sz*0.18, sz*0.65);
    // razor stretch
    geo.scale(1, 0.35+Math.random()*0.5, 1+Math.random()*1.4);
    const mesh = new THREE.Mesh(geo, shardMat);
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    const R = 1.85 + Math.random()*0.9;
    const px = R*Math.sin(phi)*Math.cos(theta);
    const py = 0.35 + R*Math.cos(phi)*0.9;
    const pz = R*Math.sin(phi)*Math.sin(theta);
    mesh.position.set(px,py,pz);
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    mesh.castShadow = true;
    const dir = new THREE.Vector3(px, py-0.35, pz).normalize();
    shardData.push({ mesh, dir, dist:R-1.8, spin:new THREE.Vector3((Math.random()-0.5)*1.2,(Math.random()-0.5)*1.2,(Math.random()-0.5)*1.2), base:mesh.position.clone() });
    shards.add(mesh);
  }
  // prism edge glints: tiny additive edges on biggest shards
  const edgeMat = new THREE.LineBasicMaterial({ color:0xd8f6ff, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending });
  shardData.slice(0,22).forEach(s=>{
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(s.mesh.geometry), edgeMat);
    s.mesh.add(e);
  });
}

/* ============ OIL DROPLET + SPLASH CROWN + MICRO-DROPLETS ============ */
const oilMat = new THREE.MeshPhysicalMaterial({
  color: 0x07070e, roughness: 0.1, metalness: 0.35,
  clearcoat: 1, clearcoatRoughness: 0.06,
  iridescence: 1.0, iridescenceIOR: 2.3,
  iridescenceThicknessRange: [80, 900],
  iridescenceMap: swirlMap,
  envMapIntensity: 1.9,
});
const oilGroup = new THREE.Group();
scene.add(oilGroup);

// main falling viscous droplet (deformed: sphere + tail)
const drop = new THREE.Group();
drop.position.set(0.1, 4.1, 0);
const dropBody = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 24), oilMat);
dropBody.scale.set(1, 1.45, 1);
dropBody.castShadow = true;
drop.add(dropBody);
const dropTail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.22, 0.9, 16), oilMat);
dropTail.position.y = 0.75;
drop.add(dropTail);
const dropTip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), oilMat);
dropTip.position.y = 1.2;
drop.add(dropTip);
oilGroup.add(drop);

// splash crown at impact point (top of sphere)
function makeCrown(){
  const pts=[];
  for(let i=0;i<=20;i++){
    const t=i/20;
    const r=0.18+t*1.05;
    const y=t*0.72 - Math.pow(t,2.0)*0.12;
    pts.push(new THREE.Vector2(r,y));
  }
  const geo=new THREE.LatheGeometry(pts, 96);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const ang=Math.atan2(z,x);
    const rad=Math.hypot(x,z);
    const crownH = Math.max(0,(rad-0.35)/1.0);
    const spikes = Math.sin(ang*12)*0.5 + Math.sin(ang*7+1.3)*0.3 + Math.sin(ang*23)*0.2;
    const lift = spikes*0.32*crownH*crownH;
    const pinch = 1 + spikes*0.08*crownH;
    pos.setX(i, x*pinch);
    pos.setZ(i, z*pinch);
    pos.setY(i, y+lift);
  }
  geo.computeVertexNormals();
  return geo;
}
const crown = new THREE.Mesh(makeCrown(), oilMat);
crown.position.set(0.05, 1.95, 0);
crown.castShadow = true;
oilGroup.add(crown);

// crown rim beads (surface-tension spheres on spike tips)
{
  const beadGeo = new THREE.SphereGeometry(1, 12, 10);
  const beads = new THREE.InstancedMesh(beadGeo, oilMat, 26);
  const d = new THREE.Object3D();
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2;
    const rad=1.05+Math.random()*0.25;
    const h=0.62+ (Math.sin(a*12)*0.5+Math.sin(a*7+1.3)*0.3)*0.32*((rad-0.35));
    d.position.set(0.05+Math.cos(a)*rad, 1.95+h, Math.sin(a)*rad);
    d.scale.setScalar(0.04+Math.random()*0.07);
    d.updateMatrix();
    beads.setMatrixAt(i,d.matrix);
  }
  beads.castShadow=true;
  oilGroup.add(beads);
}

// micro-droplets breaking off (frozen mid-air)
const microData=[];
{
  const mg=new THREE.SphereGeometry(1, 14, 12);
  const inst=new THREE.InstancedMesh(mg, oilMat, 90);
  const d=new THREE.Object3D();
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2;
    const rr=0.6+Math.random()*2.1;
    const yy=2.0+Math.random()*2.4;
    const s=0.015+Math.pow(Math.random(),2.2)*0.11;
    const sy=0.8+Math.random()*0.9;
    d.position.set(Math.cos(a)*rr*0.9, yy, Math.sin(a)*rr*0.9);
    d.scale.set(s, s*sy, s);
    d.updateMatrix();
    inst.setMatrixAt(i,d.matrix);
    microData.push({ x:d.position.x, y:d.position.y, z:d.position.z, s, sy, ph:Math.random()*6.28 });
  }
  inst.instanceMatrix.needsUpdate=true;
  oilGroup.add(inst);
  oilGroup.userData.microMesh = inst;
}

/* ============ GLASS DUST + BOKEH SPECKS ============ */
let dustGeo, dustPts, dustBase, dustRand;
{
  const N=900;
  const p=new Float32Array(N*3);
  const a=new Float32Array(N);
  for(let i=0;i<N;i++){
    const r=1.5+Math.random()*6.5;
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th);
    p[i*3+1]=-1.5+Math.random()*6.5;
    p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    a[i]=Math.random();
  }
  dustGeo=new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(p,3));
  dustGeo.setAttribute('aRand', new THREE.BufferAttribute(a,1));
  dustBase=p.slice();
  dustRand=a;
  const dustMat=new THREE.PointsMaterial({
    size:0.055, map:radialSprite(), transparent:true, opacity:0.75,
    color:0xfff2d8, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true,
  });
  dustPts=new THREE.Points(dustGeo,dustMat);
  scene.add(dustPts);
}
// few large sharp bokeh discs
const bokehSprites=[];
{
  const bokehTex = radialSprite('rgba(255,240,210,0.9)','rgba(255,240,210,0)');
  for(let i=0;i<26;i++){
    const sm=new THREE.SpriteMaterial({ map:bokehTex, transparent:true, opacity:0.08+Math.random()*0.16, depthWrite:false, blending:THREE.AdditiveBlending });
    const sp=new THREE.Sprite(sm);
    sp.position.set((Math.random()-0.5)*12, -1+Math.random()*6, -3-Math.random()*5);
    const s=0.25+Math.random()*0.9;
    sp.scale.set(s,s,1);
    sp.userData.ph=Math.random()*6.28;
    sp.userData.baseY=sp.position.y;
    bokehSprites.push(sp);
    scene.add(sp);
  }
}

/* ============ VOLUMETRIC BEAMS (fake) ============ */
{
  const beamMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    uniforms:{ uColor:{value:new THREE.Color(0x9ae8ff)}, uOp:{value:0.10} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec2 vUv; uniform vec3 uColor; uniform float uOp;
      void main(){
        float a = smoothstep(0.0,0.35,vUv.y)*smoothstep(1.0,0.35,vUv.y);
        a *= smoothstep(0.0,0.25,vUv.x)*smoothstep(1.0,0.75,vUv.x);
        gl_FragColor=vec4(uColor, a*uOp);
      }`
  });
  const beamL=new THREE.Mesh(new THREE.ConeGeometry(3.2,10,24,1,true), beamMat.clone());
  beamL.position.set(-5.2,3.4,-3.5); beamL.rotation.z=0.9; beamL.rotation.x=0.2;
  scene.add(beamL);
  const beamR=beamL.clone();
  beamR.position.set(5.2,3.0,-3.8); beamR.rotation.z=-0.9;
  beamR.material.uniforms.uColor.value=new THREE.Color(0xffc890);
  scene.add(beamR);
}

/* ============ POST: BLOOM + MACRO BOKEH (f/2.8) + GRADE ============ */
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight), 0.55, 0.65, 0.62);
composer.addPass(bloom);
const bokeh=new BokehPass(scene,camera,{ focus:9.0, aperture:0.0016, maxblur:0.0085 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());
// final grade: edge chromatic aberration + vignette + film grain (on tonemapped image)
const gradePass=new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uVig:{value:0.55}, uGrain:{value:0.028}, uCA:{value:0.9} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uTime,uVig,uGrain,uCA;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 d=vUv-0.5; float r2=dot(d,d);
      vec2 ca=d*r2*uCA*0.012;
      vec3 col;
      col.r=texture2D(tDiffuse,vUv+ca).r;
      col.g=texture2D(tDiffuse,vUv).g;
      col.b=texture2D(tDiffuse,vUv-ca).b;
      col*=1.0-uVig*smoothstep(0.10,0.72,r2);
      col+=(hash(vUv*913.0+fract(uTime)*7.0)-0.5)*uGrain;
      gl_FragColor=vec4(col,1.0);
    }`
});
composer.addPass(gradePass);

/* ============ ANIMATE — frozen high-speed, ultra slow drift ============ */
const clock=new THREE.Clock();
const breathVec=new THREE.Vector3();
const microDummy=new THREE.Object3D();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const ts=t*0.28; // slow-motion time
  camera.position.sub(breathVec); // undo last frame's handheld offset

  causticUniforms.uTime.value=t*0.55;
  gradePass.uniforms.uTime.value=t;

  // ---- real-time chronometer hands ----
  const now=new Date();
  const secF=now.getSeconds()+now.getMilliseconds()/1000;
  const minF=now.getMinutes()+secF/60;
  const hrF=(now.getHours()%12)+minF/60;
  secHand.rotation.z=-(secF/60)*Math.PI*2;
  minHand.rotation.z=-(minF/60)*Math.PI*2;
  hourHand.rotation.z=-(hrF/12)*Math.PI*2;

  // ---- tourbillon: slow cage rev + fast balance oscillation ----
  tbCage.rotation.y=t*0.5;
  balance.rotation.y=Math.sin(t*9.0)*0.85;
  balance.scale.y=1+Math.sin(t*18.0)*0.06;

  // ---- light choreography ----
  rimL.intensity=160+Math.sin(t*0.8)*14;
  rimR.intensity=120+Math.sin(t*0.65+2.0)*10;
  underGlow.intensity=6+Math.sin(t*1.1)*1.2;
  crownGlow.intensity=2.6+Math.sin(t*7.3)*0.3+Math.sin(t*13.7)*0.15;

  // jelly pulse + float
  const pulse=1+Math.sin(t*1.8)*0.035;
  jelly.scale.set(pulse, 1/Math.sqrt(pulse), pulse);
  jelly.position.y=core.position.y+Math.sin(t*0.9)*0.05;
  jelly.rotation.y=ts*0.35;
  bioLight.intensity=7+Math.sin(t*2.4)*1.6;
  bell.material.emissiveIntensity=0.24+Math.sin(t*2.0)*0.10;

  // shards: suspended + micro rotation (frozen shatter)
  for(const s of shardData){
    const w=Math.sin(ts*0.7+s.base.x*3.1+s.base.y*2.2)*0.06;
    s.mesh.position.copy(s.base).addScaledVector(s.dir, w + Math.sin(ts*0.4+s.dist*4.0)*0.03);
    s.mesh.rotation.x+=s.spin.x*0.0022;
    s.mesh.rotation.y+=s.spin.y*0.0022;
    s.mesh.rotation.z+=s.spin.z*0.0022;
  }

  // oil: viscous shimmer, crown breathing, droplet hover
  drop.position.y=4.1+Math.sin(t*0.7)*0.07;
  dropBody.scale.y=1.45+Math.sin(t*3.2)*0.03;
  crown.scale.set(1+Math.sin(t*2.2)*0.008, 1+Math.sin(t*2.8)*0.012, 1+Math.sin(t*2.2)*0.008);
  oilMat.iridescenceIOR=2.3+Math.sin(t*0.5)*0.08;

  // micro-droplets: gentle hover bob (absolute, no drift)
  {
    const inst=oilGroup.userData.microMesh;
    for(let i=0;i<microData.length;i++){
      const m=microData[i];
      microDummy.position.set(m.x, m.y+Math.sin(t*0.6+m.ph)*0.05, m.z);
      microDummy.scale.set(m.s, m.s*m.sy, m.s);
      microDummy.rotation.set(0,0,0);
      microDummy.updateMatrix();
      inst.setMatrixAt(i,microDummy.matrix);
    }
    inst.instanceMatrix.needsUpdate=true;
  }

  // dust drift catching light (absolute positions, all motes move)
  const dp=dustGeo.attributes.position;
  for(let i=0;i<dp.count;i++){
    const a=dustRand[i]*6.283;
    dp.array[i*3]  =dustBase[i*3]  +Math.cos(t*0.25+a)*0.06;
    dp.array[i*3+1]=dustBase[i*3+1]+Math.sin(t*0.35+a*1.7)*0.09;
    dp.array[i*3+2]=dustBase[i*3+2]+Math.sin(t*0.20+a)*0.06;
  }
  dp.needsUpdate=true;
  dustPts.rotation.y=ts*0.02;

  // bokeh float
  for(const sp of bokehSprites){ sp.position.y=sp.userData.baseY+Math.sin(t*0.4+sp.userData.ph)*0.3; }

  controls.update();
  // handheld macro breathing — applied after controls so it never fights the orbit
  breathVec.set(Math.sin(t*0.22)*0.08, Math.sin(t*0.30)*0.06, Math.cos(t*0.18)*0.05);
  camera.position.add(breathVec);
  camera.lookAt(controls.target);
  composer.render();
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
const loader=document.getElementById('loader');
loader.style.opacity='0';
setTimeout(()=>loader.remove(),1200);
</script>
